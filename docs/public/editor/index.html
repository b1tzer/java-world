<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="renderer" content="webkit"/><meta name="force-rendering" content="webkit"/><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/><link rel="icon" href="/java-world/editor/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SVG 编辑器</title><style>::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{border-radius:8px;background:rgba(0,0,0,.2)}::-webkit-scrollbar-track{border-radius:0;background:rgba(0,0,0,.1)}</style><script type="module" crossorigin src="/java-world/editor/js/index.249a8722.js"></script><link rel="stylesheet" href="/java-world/editor/assets/index-06787a19.css"></head><body><div id="app"></div>
<script>
// iframe postMessage 桥接：接收父窗口 SVG 数据
(function() {
  window.addEventListener('message', function(event) {
    var data = event.data;
    if (!data || data.source !== 'svg-editor-parent') return;
    window.__svgEditorData = { path: data.path, content: data.content };
    console.log('[editor iframe] 收到 SVG:', data.path);
  });
  window.parent.postMessage({ source: 'svg-editor-iframe', type: 'ready' }, '*');
})();
</script>
</body></html>
