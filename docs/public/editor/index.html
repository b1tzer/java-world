<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="renderer" content="webkit"/><meta name="force-rendering" content="webkit"/><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/><link rel="icon" href="./favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SVG 编辑器</title><script type="module" crossorigin src="./js/index.aca00d52.js"></script><link rel="stylesheet" href="./assets/index-e85bcceb.css"></head><body><div id="app"></div>
<script>
// === iframe postMessage 桥接：接收父窗口 SVG 数据 ===
(function() {
  window.addEventListener('message', function(event) {
    const data = event.data;
    if (!data || data.source !== 'svg-editor-parent') return;
    
    // 存储 SVG 信息供后续使用
    window.__svgEditorData = {
      path: data.path,
      content: data.content,
    };
    
    console.log('[editor iframe] 收到 SVG:', data.path);
    
    // 如果 fabric 已加载，立即初始化
    var checkFabric = setInterval(function() {
      if (window.fabric) {
        clearInterval(checkFabric);
        loadSvgToCanvas(data.content, data.path);
      }
    }, 200);
    
    // 10秒超时
    setTimeout(function() { clearInterval(checkFabric); }, 10000);
  });
  
  function loadSvgToCanvas(svgContent, path) {
    // 获取 vue-fabric-editor 的 canvas 实例
    // 通过轮询查找 editor 实例
    var checkEditor = setInterval(function() {
      var appEl = document.querySelector('#app');
      if (!appEl || !appEl.__vue_app__) return;
      
      // 尝试访问 HomeView 的 editor 实例
      var vm = appEl.__vue_app__._instance;
      if (!vm || !vm.proxy) return;
      
      // 通过 provide/inject 获取 canvas
      var canvasInstance = vm.proxy.$refs;
      clearInterval(checkEditor);
      
      console.log('[editor iframe] Vue app found, loading SVG...');
      fabric.loadSVGFromString(svgContent, function(objects, options) {
        // 这个需要在 vue-fabric-editor 的 canvas 上下文中执行
        console.log('[editor iframe] SVG 解析完成, objects:', objects.length);
        // TODO: 将 objects 添加到 vue-fabric-editor 的 canvas
      });
    }, 300);
    
    setTimeout(function() { clearInterval(checkEditor); }, 15000);
  }
  
  // 通知父窗口已准备就绪
  window.parent.postMessage({ source: 'svg-editor-iframe', type: 'ready' }, '*');
})();
</script>
</body></html>
