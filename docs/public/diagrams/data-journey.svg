<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">从网卡到进程：数据的旅程</text>

  <!-- 网卡 -->
  <rect x="160" y="50" width="200" height="44" rx="6" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="260" y="77" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">网卡（硬件）</text>
  <!-- arrow -->
  <line x1="260" y1="94" x2="260" y2="124" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <text x="276" y="114" fill="var(--diagram-text-3)" font-size="9">DMA 到内核内存</text>

  <!-- 链路层 -->
  <rect x="160" y="128" width="200" height="44" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="260" y="148" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold">链路层</text>
  <text x="260" y="164" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">校验 MAC 地址，剥离帧头</text>
  <line x1="260" y1="172" x2="260" y2="202" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- 网络层 -->
  <rect x="160" y="206" width="200" height="44" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">网络层</text>
  <text x="260" y="242" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">校验 IP 地址，路由判断</text>
  <line x1="260" y1="250" x2="260" y2="280" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- 传输层 -->
  <rect x="160" y="284" width="200" height="56" rx="6" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="260" y="304" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">传输层</text>
  <text x="260" y="320" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">根据端口号找到对应的 Socket</text>
  <text x="260" y="334" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">数据写入 Socket 的接收缓冲区</text>
  <line x1="260" y1="340" x2="260" y2="370" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- 应用程序 -->
  <rect x="160" y="374" width="200" height="44" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="260" y="394" text-anchor="middle" fill="var(--diagram-accent-4)" font-weight="bold">应用程序</text>
  <text x="260" y="410" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">read() 从缓冲区取出数据</text>

  <!-- 侧边注释 -->
  <rect x="30" y="280" width="110" height="70" rx="4" fill="none" stroke="var(--diagram-accent-3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="85" y="302" text-anchor="middle" fill="var(--diagram-accent-3)" font-size="10" font-weight="bold">关键一步</text>
  <text x="85" y="320" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">根据五元组</text>
  <text x="85" y="336" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">找到 Socket</text>
  <line x1="140" y1="312" x2="158" y2="312" stroke="var(--diagram-accent-3)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 底部注释 -->
  <text x="260" y="452" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">Socket 的价值：把复杂的协议栈封装成"读写缓冲区"</text>
  <text x="260" y="470" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">对应用而言，网络通信和读写文件几乎没有区别</text>
</svg>