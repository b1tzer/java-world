<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <defs>
    <marker id="arS1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">秒杀系统架构图</text>

  <!-- Layer 1: CDN/Nginx -->
  <g transform="translate(150,48)">
    <rect x="0" y="0" width="400" height="56" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">CDN / Nginx</text>
    <text x="200" y="42" text-anchor="middle" font-size="11" fill="#1565C0">← 静态资源缓存</text>
  </g>
  <line x1="350" y1="108" x2="350" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 2: Gateway -->
  <g transform="translate(150,136)">
    <rect x="0" y="0" width="400" height="56" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">网关层（Gateway）</text>
    <text x="200" y="42" text-anchor="middle" font-size="11" fill="#2E7D32">← 限流 + 验证码</text>
  </g>
  <line x1="350" y1="196" x2="350" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 3: Seckill Services Cluster -->
  <g transform="translate(60,224)">
    <rect x="0" y="0" width="580" height="70" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="290" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">秒杀服务集群</text>
    <rect x="20" y="30" width="160" height="30" rx="4" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
    <text x="100" y="50" text-anchor="middle" font-size="11" fill="#BF360C">秒杀服务 1</text>
    <rect x="210" y="30" width="160" height="30" rx="4" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
    <text x="290" y="50" text-anchor="middle" font-size="11" fill="#BF360C">秒杀服务 2</text>
    <rect x="400" y="30" width="160" height="30" rx="4" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
    <text x="480" y="50" text-anchor="middle" font-size="11" fill="#BF360C">秒杀服务 3</text>
  </g>
  <line x1="350" y1="298" x2="350" y2="322" stroke="#555" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 4: Redis Cluster -->
  <g transform="translate(120,326)">
    <rect x="0" y="0" width="460" height="60" rx="6" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">Redis Cluster</text>
    <text x="230" y="44" text-anchor="middle" font-size="11" fill="#6A1B9A">← 库存预减（Lua 原子操作）</text>
  </g>
  <line x1="350" y1="390" x2="350" y2="414" stroke="#555" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 5: MQ -->
  <g transform="translate(120,418)">
    <rect x="0" y="0" width="460" height="60" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#B71C1C">RocketMQ / Kafka</text>
    <text x="230" y="44" text-anchor="middle" font-size="11" fill="#C62828">← 异步下单（削峰填谷）</text>
  </g>
  <line x1="350" y1="482" x2="350" y2="506" stroke="#555" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 6: Order Service + DB -->
  <g transform="translate(120,510)">
    <rect x="0" y="0" width="460" height="60" rx="6" fill="#E0F2F1" stroke="#00695C" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#004D40">订单服务 + 数据库</text>
    <text x="230" y="44" text-anchor="middle" font-size="11" fill="#00695C">← 异步创建订单（最终一致）</text>
  </g>

  <!-- Flow labels on the right -->
  <g transform="translate(590,48)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="10" fill="#0D47A1">① 静态缓存</text>
    <text x="45" y="38" text-anchor="middle" font-size="10" fill="#0D47A1">消峰 60-80%</text>
  </g>
  <g transform="translate(590,136)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="10" fill="#1B5E20">② 令牌桶</text>
    <text x="45" y="38" text-anchor="middle" font-size="10" fill="#1B5E20">限流保护</text>
  </g>
  <g transform="translate(590,326)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="10" fill="#4A148C">③ 原子扣减</text>
    <text x="45" y="38" text-anchor="middle" font-size="10" fill="#4A148C">防超卖</text>
  </g>
  <g transform="translate(590,418)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="10" fill="#B71C1C">④ 异步削峰</text>
    <text x="45" y="38" text-anchor="middle" font-size="10" fill="#B71C1C">流量整形</text>
  </g>
  <g transform="translate(590,510)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="#E0F2F1" stroke="#00695C" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="10" fill="#004D40">⑤ 异步下单</text>
    <text x="45" y="38" text-anchor="middle" font-size="10" fill="#004D40">最终一致</text>
  </g>

  <!-- Summary -->
  <g transform="translate(120,590)">
    <rect x="0" y="0" width="460" height="40" rx="6" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
    <text x="230" y="16" text-anchor="middle" font-size="11" fill="#555">核心策略：逐层过滤，将 100 万请求削减到数据库可承受的量级</text>
    <text x="230" y="32" text-anchor="middle" font-size="10" fill="#999">CDN → 网关限流 → Redis 预减 → MQ 削峰 → 异步写库</text>
  </g>
</svg>