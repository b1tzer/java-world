<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arS1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-text-2)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">秒杀系统架构图</text>

  <!-- Layer 1: CDN/Nginx -->
  <g transform="translate(150,48)">
    <rect x="0" y="0" width="400" height="56" rx="6" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
    <text x="200" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-1)">CDN / Nginx</text>
    <text x="200" y="42" text-anchor="middle" font-size="9" fill="var(--diagram-accent-1)">← 静态资源缓存</text>
  </g>
  <line x1="350" y1="108" x2="350" y2="132" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 2: Gateway -->
  <g transform="translate(150,136)">
    <rect x="0" y="0" width="400" height="56" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
    <text x="200" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-2)">网关层（Gateway）</text>
    <text x="200" y="42" text-anchor="middle" font-size="9" fill="var(--diagram-accent-2)">← 限流 + 验证码</text>
  </g>
  <line x1="350" y1="196" x2="350" y2="220" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 3: Seckill Services Cluster -->
  <g transform="translate(60,224)">
    <rect x="0" y="0" width="580" height="70" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
    <text x="290" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-4)">秒杀服务集群</text>
    <rect x="20" y="30" width="160" height="30" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
    <text x="100" y="50" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">秒杀服务 1</text>
    <rect x="210" y="30" width="160" height="30" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
    <text x="290" y="50" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">秒杀服务 2</text>
    <rect x="400" y="30" width="160" height="30" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
    <text x="480" y="50" text-anchor="middle" font-size="9" fill="var(--diagram-accent-text-4)">秒杀服务 3</text>
  </g>
  <line x1="350" y1="298" x2="350" y2="322" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 4: Redis Cluster -->
  <g transform="translate(120,326)">
    <rect x="0" y="0" width="460" height="60" rx="6" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-3)">Redis Cluster</text>
    <text x="230" y="44" text-anchor="middle" font-size="9" fill="var(--diagram-accent-3)">← 库存预减（Lua 原子操作）</text>
  </g>
  <line x1="350" y1="390" x2="350" y2="414" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 5: MQ -->
  <g transform="translate(120,418)">
    <rect x="0" y="0" width="460" height="60" rx="6" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-5)">RocketMQ / Kafka</text>
    <text x="230" y="44" text-anchor="middle" font-size="9" fill="var(--diagram-accent-5)">← 异步下单（削峰填谷）</text>
  </g>
  <line x1="350" y1="482" x2="350" y2="506" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arS1)"/>

  <!-- Layer 6: Order Service + DB -->
  <g transform="translate(120,510)">
    <rect x="0" y="0" width="460" height="60" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
    <text x="230" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-2)">订单服务 + 数据库</text>
    <text x="230" y="44" text-anchor="middle" font-size="9" fill="var(--diagram-accent-2)">← 异步创建订单（最终一致）</text>
  </g>

  <!-- Flow labels on the right -->
  <g transform="translate(590,48)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-1)">① 静态缓存</text>
    <text x="45" y="38" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-1)">消峰 60-80%</text>
  </g>
  <g transform="translate(590,136)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-2)">② 令牌桶</text>
    <text x="45" y="38" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-2)">限流保护</text>
  </g>
  <g transform="translate(590,326)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-3)">③ 原子扣减</text>
    <text x="45" y="38" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-3)">防超卖</text>
  </g>
  <g transform="translate(590,418)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-5)">④ 异步削峰</text>
    <text x="45" y="38" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-5)">流量整形</text>
  </g>
  <g transform="translate(590,510)">
    <rect x="0" y="0" width="90" height="56" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
    <text x="45" y="20" text-anchor="middle" font-size="8" fill="var(--diagram-accent-2)">⑤ 异步下单</text>
    <text x="45" y="38" text-anchor="middle" font-size="8" fill="var(--diagram-accent-2)">最终一致</text>
  </g>

  <!-- Summary -->
  <g transform="translate(120,590)">
    <rect x="0" y="0" width="460" height="40" rx="6" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
    <text x="230" y="16" text-anchor="middle" font-size="9" fill="var(--diagram-text-2)">核心策略：逐层过滤，将 100 万请求削减到数据库可承受的量级</text>
    <text x="230" y="32" text-anchor="middle" font-size="8" fill="var(--diagram-ghost)">CDN → 网关限流 → Redis 预减 → MQ 削峰 → 异步写库</text>
  </g>
</svg>