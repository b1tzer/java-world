<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-1)"/>
    </marker>
    <linearGradient id="lg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color: var(--diagram-accent-1)"/>
      <stop offset="100%" style="stop-color: var(--diagram-accent-1)"/>
    </linearGradient>
  </defs>

  <!-- Entry -->
  <rect x="110" y="20" width="200" height="44" rx="6" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="210" y="48" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-size="15" font-weight="bold">浏览器 / 客户端</text>

  <line x1="210" y1="64" x2="210" y2="88" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Controller -->
  <rect x="90" y="90" width="240" height="52" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="210" y="122" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="14" font-weight="bold">Controller</text>
  <text x="340" y="122" fill="var(--diagram-text-3)" font-size="11">← 参数校验、序列化</text>

  <line x1="210" y1="142" x2="210" y2="166" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Service -->
  <rect x="90" y="168" width="240" height="52" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="210" y="200" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="14" font-weight="bold">Service</text>
  <text x="340" y="200" fill="var(--diagram-text-3)" font-size="11">← 业务逻辑、事务边界</text>

  <line x1="210" y1="220" x2="210" y2="244" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- DAO/Mapper -->
  <rect x="90" y="246" width="240" height="52" rx="6" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="210" y="278" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-size="14" font-weight="bold">DAO / Mapper</text>
  <text x="340" y="278" fill="var(--diagram-text-3)" font-size="11">← SQL 映射、结果映射</text>

  <line x1="210" y1="298" x2="210" y2="322" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Connection Pool -->
  <rect x="90" y="324" width="240" height="52" rx="6" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1.5"/>
  <text x="210" y="356" text-anchor="middle" fill="var(--diagram-text-1)" font-size="14" font-weight="bold">连接池</text>
  <text x="340" y="356" fill="var(--diagram-text-3)" font-size="11">← 获取 / 归还连接</text>

  <line x1="210" y1="376" x2="210" y2="400" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Database -->
  <rect x="90" y="402" width="240" height="52" rx="6" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="210" y="434" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-size="14" font-weight="bold">Database</text>
  <text x="340" y="434" fill="var(--diagram-text-3)" font-size="11">← SQL 解析、执行计划、磁盘 I/O</text>

  <!-- Side note -->
  <rect x="60" y="475" width="300" height="44" rx="8" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="210" y="495" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="13" font-weight="bold">⚠ 每一层都可能是瓶颈</text>
  <text x="210" y="512" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">不要只盯着 SQL 优化</text>

  <!-- Vertical bottleneck markers on the right -->
  <rect x="350" y="90" width="6" height="364" rx="3" fill="var(--diagram-accent-1)" opacity="0.15"/>
  <text x="370" y="275" fill="var(--diagram-accent-1)" font-size="11" transform="rotate(90,370,275)" text-anchor="middle" font-weight="bold">性能瓶颈可能在任意层</text>
</svg>