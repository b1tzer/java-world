<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <defs>
    <marker id="aDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
    <marker id="aRight" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text-1)">全连接队列与半连接队列</text>

  <!-- SYN queue -->
  <text x="160" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-accent-4)">半连接队列（SYN queue）</text>
  <rect x="40" y="74" width="240" height="56" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="60" y="96" fill="var(--diagram-accent-text-4)" font-size="12">SYN_RECV 状态</text>
  <text x="60" y="116" fill="var(--diagram-text-2)" font-size="12">客户端发了 SYN，三次握手还没完成</text>
  <text x="280" y="116" fill="var(--diagram-text-3)" font-size="11">tcp_max_syn_backlog</text>

  <!-- arrow: SYN → accept -->
  <line x1="160" y1="130" x2="160" y2="170" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#aDown)"/>
  <text x="176" y="155" fill="var(--diagram-arrow)" font-size="11">三次握手完成（收到客户端 ACK）</text>

  <!-- accept queue -->
  <text x="160" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-accent-1)">全连接队列（accept queue）</text>
  <rect x="40" y="204" width="240" height="56" rx="6" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="60" y="226" fill="var(--diagram-accent-text-1)" font-size="12">ESTABLISHED 状态</text>
  <text x="60" y="246" fill="var(--diagram-text-2)" font-size="12">连接已建立，等待 accept() 取走</text>
  <text x="280" y="246" fill="var(--diagram-text-3)" font-size="11">listen(backlog) 参数</text>

  <!-- arrow: accept → process -->
  <line x1="160" y1="260" x2="160" y2="300" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#aDown)"/>
  <text x="176" y="285" fill="var(--diagram-arrow)" font-size="11">应用调用 accept()</text>

  <!-- process -->
  <rect x="100" y="304" width="120" height="40" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="160" y="330" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">进程拿到 connFd</text>

  <!-- 右侧：溢出说明 -->
  <rect x="340" y="60" width="280" height="140" rx="8" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-5)">全连接队列满时</text>

  <text x="360" y="108" fill="var(--diagram-text-1)" font-size="12">默认（tcp_abort_on_overflow=0）</text>
  <text x="360" y="126" fill="var(--diagram-arrow)" font-size="12">内核丢弃新的 ACK</text>
  <text x="360" y="144" fill="var(--diagram-arrow)" font-size="12">客户端以为连接成功，实际服务端不知道</text>
  <text x="360" y="170" fill="var(--diagram-text-1)" font-size="12">tcp_abort_on_overflow=1</text>
  <text x="360" y="188" fill="var(--diagram-arrow)" font-size="12">内核直接发 RST，客户端立刻收到 reset</text>

  <!-- 右侧：排查命令 -->
  <rect x="340" y="220" width="280" height="110" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="480" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-3)">排查方法</text>

  <text x="360" y="268" fill="var(--diagram-text-1)" font-size="12">ss -ltn | grep 8080</text>
  <text x="360" y="288" fill="var(--diagram-arrow)" font-size="12">Recv-Q > Send-Q → 队列溢出</text>
  <text x="360" y="308" fill="var(--diagram-text-1)" font-size="12">netstat -s | grep "listen queue"</text>
  <text x="360" y="324" fill="var(--diagram-arrow)" font-size="12">overflowed 数字持续增长 → 加大 backlog</text>

  <!-- 底部注释 -->
  <text x="320" y="380" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">客户端 SYN 到达 → 半连接队列 → 三次握手完成 → 全连接队列 → accept() 取走</text>
  <text x="320" y="400" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">瓶颈不在端口数，而在队列大小和 fd 上限</text>
</svg>