<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <defs>
    <marker id="aDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="aRight" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">全连接队列与半连接队列</text>

  <!-- SYN queue -->
  <text x="160" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">半连接队列（SYN queue）</text>
  <rect x="40" y="74" width="240" height="56" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="60" y="96" fill="#BF360C" font-size="12">SYN_RECV 状态</text>
  <text x="60" y="116" fill="#666" font-size="12">客户端发了 SYN，三次握手还没完成</text>
  <text x="280" y="116" fill="#888" font-size="11">tcp_max_syn_backlog</text>

  <!-- arrow: SYN → accept -->
  <line x1="160" y1="130" x2="160" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#aDown)"/>
  <text x="176" y="155" fill="#555" font-size="11">三次握手完成（收到客户端 ACK）</text>

  <!-- accept queue -->
  <text x="160" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">全连接队列（accept queue）</text>
  <rect x="40" y="204" width="240" height="56" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="60" y="226" fill="#0D47A1" font-size="12">ESTABLISHED 状态</text>
  <text x="60" y="246" fill="#666" font-size="12">连接已建立，等待 accept() 取走</text>
  <text x="280" y="246" fill="#888" font-size="11">listen(backlog) 参数</text>

  <!-- arrow: accept → process -->
  <line x1="160" y1="260" x2="160" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#aDown)"/>
  <text x="176" y="285" fill="#555" font-size="11">应用调用 accept()</text>

  <!-- process -->
  <rect x="100" y="304" width="120" height="40" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="160" y="330" text-anchor="middle" fill="#1B5E20" font-weight="bold">进程拿到 connFd</text>

  <!-- 右侧：溢出说明 -->
  <rect x="340" y="60" width="280" height="140" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#B71C1C">全连接队列满时</text>

  <text x="360" y="108" fill="#333" font-size="12">默认（tcp_abort_on_overflow=0）</text>
  <text x="360" y="126" fill="#555" font-size="12">内核丢弃新的 ACK</text>
  <text x="360" y="144" fill="#555" font-size="12">客户端以为连接成功，实际服务端不知道</text>
  <text x="360" y="170" fill="#333" font-size="12">tcp_abort_on_overflow=1</text>
  <text x="360" y="188" fill="#555" font-size="12">内核直接发 RST，客户端立刻收到 reset</text>

  <!-- 右侧：排查命令 -->
  <rect x="340" y="220" width="280" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="480" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">排查方法</text>

  <text x="360" y="268" fill="#333" font-size="12">ss -ltn | grep 8080</text>
  <text x="360" y="288" fill="#555" font-size="12">Recv-Q > Send-Q → 队列溢出</text>
  <text x="360" y="308" fill="#333" font-size="12">netstat -s | grep "listen queue"</text>
  <text x="360" y="324" fill="#555" font-size="12">overflowed 数字持续增长 → 加大 backlog</text>

  <!-- 底部注释 -->
  <text x="320" y="380" text-anchor="middle" fill="#888" font-size="12">客户端 SYN 到达 → 半连接队列 → 三次握手完成 → 全连接队列 → accept() 取走</text>
  <text x="320" y="400" text-anchor="middle" fill="#888" font-size="12">瓶颈不在端口数，而在队列大小和 fd 上限</text>
</svg>