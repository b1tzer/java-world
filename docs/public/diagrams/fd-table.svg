<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-text-3)"/>
    </marker>
  </defs>

  <text x="300" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">进程的文件描述符表</text>

  <!-- 表头 -->
  <rect x="60" y="48" width="100" height="36" fill="var(--diagram-text-1)" rx="4"/>
  <text x="110" y="72" text-anchor="middle" fill="var(--diagram-surface-1)" font-weight="bold">fd</text>
  <rect x="160" y="48" width="380" height="36" fill="var(--diagram-text-1)" rx="4"/>
  <text x="350" y="72" text-anchor="middle" fill="var(--diagram-surface-1)" font-weight="bold">指向的内核对象</text>

  <!-- fd 0 -->
  <rect x="60" y="84" width="100" height="36" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="110" y="108" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">0</text>
  <rect x="160" y="84" width="380" height="36" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="180" y="108" fill="var(--diagram-text-1)">stdin（标准输入）</text>

  <!-- fd 1 -->
  <rect x="60" y="120" width="100" height="36" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="110" y="144" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">1</text>
  <rect x="160" y="120" width="380" height="36" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="180" y="144" fill="var(--diagram-text-1)">stdout（标准输出）</text>

  <!-- fd 2 -->
  <rect x="60" y="156" width="100" height="36" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="110" y="180" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">2</text>
  <rect x="160" y="156" width="380" height="36" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="180" y="180" fill="var(--diagram-text-1)">stderr（标准错误）</text>

  <!-- fd 3 -->
  <rect x="60" y="192" width="100" height="36" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="110" y="216" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">3</text>
  <rect x="160" y="192" width="380" height="36" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-2)" stroke-width="1"/>
  <text x="180" y="216" fill="var(--diagram-text-1)">/var/log/app.log</text>

  <!-- fd 4 - Socket -->
  <rect x="60" y="228" width="100" height="36" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="110" y="252" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">4</text>
  <rect x="160" y="228" width="380" height="36" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="180" y="248" fill="var(--diagram-accent-text-1)" font-size="10">Socket（TCP）</text>
  <text x="180" y="262" fill="var(--diagram-accent-1)" font-size="9">192.168.1.1:8080 → 10.0.0.5:43210</text>

  <!-- fd 5 - Socket -->
  <rect x="60" y="264" width="100" height="36" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="110" y="288" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">5</text>
  <rect x="160" y="264" width="380" height="36" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="180" y="284" fill="var(--diagram-accent-text-1)" font-size="10">Socket（TCP）</text>
  <text x="180" y="298" fill="var(--diagram-accent-1)" font-size="9">192.168.1.1:8080 → 10.0.0.6:51782</text>

  <!-- 右侧注释 -->
  <line x1="545" y1="240" x2="570" y2="240" stroke="var(--diagram-accent-1)" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="570" y="220" width="28" height="80" fill="none"/>
  <text x="584" y="245" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="9" font-weight="bold">每</text>
  <text x="584" y="261" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="9" font-weight="bold">个</text>
  <text x="584" y="277" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="9" font-weight="bold">Socket</text>
  <text x="584" y="293" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="9" font-weight="bold">占 1</text>
  <text x="584" y="309" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="9" font-weight="bold">个 fd</text>

  <!-- 底部注释 -->
  <text x="300" y="330" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">Socket 本质是 fd + 协议栈，close(fd) 同时释放两者</text>
</svg>