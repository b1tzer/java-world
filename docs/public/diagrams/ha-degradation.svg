<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <defs>
    <marker id="arH1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-text-2)"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text-1)">服务降级：线程池隔离</text>

  <!-- API Gateway -->
  <g transform="translate(220,48)">
    <rect x="0" y="0" width="260" height="44" rx="6" fill="var(--diagram-accent-1)" stroke="none"/>
    <text x="130" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-surface-1)">API Gateway</text>
  </g>

  <!-- Three arrows down -->
  <line x1="230" y1="96" x2="120" y2="130" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arH1)"/>
  <line x1="350" y1="96" x2="350" y2="130" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arH1)"/>
  <line x1="470" y1="96" x2="580" y2="130" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#arH1)"/>

  <!-- Order Service -->
  <g transform="translate(30,134)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-2)">订单服务</text>
    <rect x="15" y="36" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
    <text x="90" y="54" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-2)">线程池 A</text>
    <rect x="15" y="72" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
    <text x="90" y="90" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-2)">20 线程</text>
  </g>

  <!-- Payment Service -->
  <g transform="translate(260,134)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-5)">支付服务</text>
    <rect x="15" y="36" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="90" y="54" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-5)">线程池 B</text>
    <rect x="15" y="72" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="90" y="90" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-5)">10 线程</text>
  </g>

  <!-- Inventory Service -->
  <g transform="translate(490,134)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-1)">库存服务</text>
    <rect x="15" y="36" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="90" y="54" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)">线程池 C</text>
    <rect x="15" y="72" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="90" y="90" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)">15 线程</text>
  </g>

  <!-- Failure scenario -->
  <g transform="translate(260,256)">
    <rect x="0" y="0" width="180" height="36" rx="4" fill="var(--diagram-accent-5)" stroke="none" opacity="0.15"/>
    <text x="90" y="14" text-anchor="middle" font-size="11" fill="var(--diagram-accent-5)" font-weight="bold">支付服务变慢</text>
    <text x="90" y="30" text-anchor="middle" font-size="10" fill="var(--diagram-accent-5)">→ 只耗尽线程池 B</text>
  </g>

  <!-- Result -->
  <g transform="translate(100,310)">
    <rect x="0" y="0" width="500" height="50" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
    <text x="250" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-2)">✓ 订单和库存不受影响</text>
    <text x="250" y="40" text-anchor="middle" font-size="11" fill="var(--diagram-accent-2)">故障被隔离在支付服务的线程池内，不会扩散到其他服务</text>
  </g>

  <!-- Core principle -->
  <g transform="translate(100,372)">
    <text x="250" y="14" text-anchor="middle" font-size="12" fill="var(--diagram-text-2)" font-style="italic">核心思想：一个服务出问题，不应该拖垮整个系统（舱壁模式 Bulkhead Pattern）</text>
  </g>
</svg>