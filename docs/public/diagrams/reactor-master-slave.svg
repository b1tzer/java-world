<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="290" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">主从多 Reactor 模式（Netty 采用）</text>
  <!-- Boss Reactor -->
  <rect x="30" y="70" width="180" height="120" rx="10" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="11">Boss Reactor</text>
  <text x="120" y="120" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">1 个线程</text>
  <rect x="50" y="135" width="140" height="36" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
  <text x="120" y="159" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-size="10">Selector（ACCEPT）</text>
  <!-- Arrow -->
  <line x1="210" y1="130" x2="278" y2="130" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#ar5)"/>
  <text x="244" y="120" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="9">accept</text>
  <!-- Worker Reactor Pool -->
  <rect x="280" y="50" width="270" height="220" rx="10" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="2"/>
  <text x="415" y="80" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="11">Worker Reactor Pool</text>
  <text x="415" y="100" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">N 个线程（CPU 核心数 × 2）</text>
  <!-- Workers -->
  <rect x="300" y="115" width="105" height="60" rx="6" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="352" y="140" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Worker-1</text>
  <text x="352" y="158" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">READ/WRITE</text>
  <rect x="415" y="115" width="105" height="60" rx="6" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="467" y="140" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Worker-2</text>
  <text x="467" y="158" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">READ/WRITE</text>
  <rect x="300" y="190" width="105" height="50" rx="6" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="352" y="220" text-anchor="middle" fill="var(--diagram-ghost)">Worker-N ...</text>
  <!-- Footer -->
  <text x="290" y="298" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">Boss 只负责 accept 新连接，Worker 负责已建立连接的读写事件</text>
  <text x="290" y="316" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">职责分离，避免 accept 和 read/write 互相阻塞</text>
  <defs><marker id="ar5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-1)"/></marker></defs>
</svg>