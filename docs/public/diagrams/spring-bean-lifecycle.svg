<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
  .label { font-size: 12px; fill: #2d3436; }
  .note { font-size: 11px; fill: #636e72; }
  .arrow { stroke: #6c5ce7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: #dfe6e9; stroke: #636e72; stroke-width: 1.5; }
  .highlight { fill: #ffeaa7; stroke: #fdcb6e; stroke-width: 1.5; }
  .action { fill: #81ecec; stroke: #00b894; stroke-width: 1.5; }
  .important { fill: #fab1a0; stroke: #e17055; stroke-width: 1.5; }
  .step { fill: #a29bfe; stroke: #6c5ce7; stroke-width: 1.5; }
  .note-box { fill: #f8f9fa; stroke: #b2bec3; stroke-width: 1; }
  .cache { fill: #fdcb6e; stroke: #f39c12; stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#6c5ce7"/>
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#e17055"/>
  </marker>
</defs>
<text x="360" y="30" class="title">Bean 生命周期全流程</text>
<rect x="180.0" y="55" width="360" height="48" class="box phase"/>
<text x="360.0" y="79.0" class="label">BeanDefinition 加载</text>
<text x="555.0" y="79.0" text-anchor="start" class="note">← 构造器调用</text>
<line x1="360" y1="103" x2="360" y2="133" class="arrow"/><rect x="180.0" y="133" width="360" height="48" class="box phase"/>
<text x="360.0" y="157.0" class="label">实例化（Instantiation）</text>
<text x="555.0" y="157.0" text-anchor="start" class="note">← @Autowired / @Value 注入</text>
<line x1="360" y1="181" x2="360" y2="211" class="arrow"/><rect x="180.0" y="211" width="360" height="48" class="box action"/>
<text x="360.0" y="235.0" class="label">属性赋值（Populate）</text>
<text x="555.0" y="235.0" text-anchor="start" class="note">← BeanNameAware / BeanFactoryAware / ApplicationContextAware</text>
<line x1="360" y1="259" x2="360" y2="289" class="arrow"/><rect x="180.0" y="289" width="360" height="48" class="box phase"/>
<text x="360.0" y="313.0" class="label">Aware 接口回调</text>
<line x1="360" y1="337" x2="360" y2="367" class="arrow"/><rect x="180.0" y="367" width="360" height="48" class="box step"/>
<text x="360.0" y="391.0" class="label">BeanPostProcessor
postProcessBeforeInitialization</text>
<line x1="360" y1="415" x2="360" y2="445" class="arrow"/><rect x="180.0" y="445" width="360" height="48" class="box highlight"/>
<text x="360.0" y="469.0" class="label">@PostConstruct / InitializingBean
afterPropertiesSet / init-method</text>
<text x="555.0" y="469.0" text-anchor="start" class="note">← AOP 代理在此创建</text>
<line x1="360" y1="493" x2="360" y2="523" class="arrow"/><rect x="180.0" y="523" width="360" height="48" class="box step"/>
<text x="360.0" y="547.0" class="label">BeanPostProcessor
postProcessAfterInitialization</text>
<line x1="360" y1="571" x2="360" y2="601" class="arrow"/><rect x="180.0" y="601" width="360" height="48" class="box important"/>
<text x="360.0" y="625.0" class="label">Bean 就绪，可被使用</text>
<line x1="360" y1="649" x2="360" y2="679" class="arrow"/><rect x="180.0" y="679" width="360" height="48" class="box phase"/>
<text x="360.0" y="703.0" class="label">@PreDestroy / DisposableBean
destroy / destroy-method</text>

</svg>