<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 800" width="750" height="800" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
  .label { font-size: 12px; fill: #2d3436; }
  .note { font-size: 11px; fill: #636e72; }
  .arrow { stroke: #6c5ce7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: #dfe6e9; stroke: #636e72; stroke-width: 1.5; }
  .highlight { fill: #ffeaa7; stroke: #fdcb6e; stroke-width: 1.5; }
  .action { fill: #81ecec; stroke: #00b894; stroke-width: 1.5; }
  .important { fill: #fab1a0; stroke: #e17055; stroke-width: 1.5; }
  .step { fill: #a29bfe; stroke: #6c5ce7; stroke-width: 1.5; }
  .note-box { fill: #f8f9fa; stroke: #b2bec3; stroke-width: 1; }
  .cache { fill: #fdcb6e; stroke: #f39c12; stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-3)"/>
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-2)"/>
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-4)"/>
  </marker>
</defs>
<text x="375" y="28" class="title">Spring MVC 请求处理流程</text>
<rect x="125.0" y="50" width="500" height="54" class="box phase"/>
<text x="375" y="68" class="label" font-weight="bold">HTTP Request</text>
<text x="375" y="88" class="note">DispatcherServlet#doDispatch()</text>
<line x1="375" y1="104" x2="375" y2="155" class="arrow"/><rect x="125.0" y="155" width="500" height="72" class="box step"/>
<text x="375" y="173" class="label" font-weight="bold">① HandlerMapping.findHandler()</text>
<text x="375" y="193" class="note">返回 HandlerExecutionChain</text>
<text x="375" y="211" class="note">→ Handler + HandlerInterceptor[]</text>
<line x1="375" y1="227" x2="375" y2="260" class="arrow"/><rect x="125.0" y="260" width="500" height="90" class="box action"/>
<text x="375" y="278" class="label" font-weight="bold">② HandlerAdapter 选择</text>
<text x="375" y="298" class="note">RequestMappingHandlerAdapter</text>
<text x="375" y="316" class="note">HttpRequestHandlerAdapter</text>
<text x="375" y="334" class="note">SimpleControllerHandlerAdapter</text>
<line x1="375" y1="350" x2="375" y2="365" class="arrow"/><rect x="125.0" y="365" width="500" height="54" class="box highlight"/>
<text x="375" y="383" class="label" font-weight="bold">③ Interceptor.preHandle()</text>
<text x="375" y="403" class="note">按顺序执行，任一返回 false 则中断</text>
<line x1="375" y1="419" x2="375" y2="470" class="arrow"/><rect x="125.0" y="470" width="500" height="72" class="box important"/>
<text x="375" y="488" class="label" font-weight="bold">④ HandlerAdapter.handle()</text>
<text x="375" y="508" class="note">参数解析 → 执行 Controller → 返回值处理</text>
<text x="375" y="526" class="note">→ ModelAndView / @ResponseBody → HttpMessageConverter</text>
<line x1="375" y1="542" x2="375" y2="575" class="arrow"/><rect x="125.0" y="575" width="500" height="36" class="box highlight"/>
<text x="375" y="593" class="label" font-weight="bold">⑤ Interceptor.postHandle()</text>
<line x1="375" y1="611" x2="375" y2="680" class="arrow"/><rect x="125.0" y="680" width="500" height="72" class="box step"/>
<text x="375" y="698" class="label" font-weight="bold">⑥ processDispatchResult()</text>
<text x="375" y="718" class="note">渲染视图（ViewResolver → View.render）</text>
<text x="375" y="736" class="note">或直接返回（@ResponseBody 已在步骤④写入）</text>

</svg>