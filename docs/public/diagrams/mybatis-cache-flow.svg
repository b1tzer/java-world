<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker>
  </defs>
  <text x="280" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text-1)">MyBatis 一级/二级缓存协作流程</text>

  <!-- SqlSession A -->
  <rect x="40" y="50" width="230" height="280" rx="10" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="155" y="76" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="12">SqlSession A</text>

  <rect x="56" y="92" width="198" height="32" rx="4" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="155" y="114" text-anchor="middle" fill="var(--diagram-text-1)" font-size="10">query(UserMapper.getById)</text>

  <rect x="56" y="132" width="198" height="28" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="155" y="152" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="10">查一级缓存 → 未命中</text>

  <rect x="56" y="168" width="198" height="28" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="155" y="188" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="10">查二级缓存 → 未命中</text>

  <rect x="56" y="204" width="198" height="28" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="155" y="224" text-anchor="middle" fill="var(--diagram-accent-2)" font-size="10">查数据库 → 返回 User</text>

  <rect x="56" y="240" width="198" height="28" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="155" y="260" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">写入一级缓存</text>

  <rect x="56" y="276" width="198" height="32" rx="4" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1"/>
  <text x="155" y="298" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-size="10">commit() → 刷入二级缓存</text>

  <!-- SqlSession B -->
  <rect x="290" y="50" width="230" height="200" rx="10" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="405" y="76" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="12">SqlSession B</text>

  <rect x="306" y="92" width="198" height="32" rx="4" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="405" y="114" text-anchor="middle" fill="var(--diagram-text-1)" font-size="10">query(UserMapper.getById)</text>

  <rect x="306" y="132" width="198" height="28" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="405" y="152" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="10">查一级缓存 → 未命中</text>

  <rect x="306" y="168" width="198" height="28" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="405" y="188" text-anchor="middle" fill="var(--diagram-accent-2)" font-weight="bold" font-size="10">查二级缓存 → 命中！</text>

  <rect x="306" y="204" width="198" height="28" rx="4" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="405" y="224" text-anchor="middle" fill="var(--diagram-ghost)" font-size="10">直接返回，不查数据库</text>

  <!-- Flow arrow from A commit to B cache hit -->
  <path d="M238,292 Q280,292 280,182 Q280,182 304,182" fill="none" stroke="var(--diagram-accent-3)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ar)"/>

  <!-- Footer -->
  <text x="280" y="360" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">一级缓存：SqlSession 级别，默认开启</text>
  <text x="280" y="380" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">二级缓存：Mapper 级别（跨 SqlSession），需手动配置</text>
  <text x="280" y="400" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">commit() 后一级缓存数据才会刷入二级缓存</text>
</svg>