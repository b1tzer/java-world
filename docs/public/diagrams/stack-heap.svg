<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-4)"/></marker>
  </defs>

  <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text-1)">栈与堆的协作关系</text>

  <!-- Stack -->
  <rect x="30" y="50" width="180" height="160" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2"/>
  <text x="120" y="76" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="15">栈（Stack）</text>

  <!-- Stack frame -->
  <rect x="50" y="92" width="140" height="48" rx="4" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="120" y="112" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">user</text>
  <text x="120" y="130" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">引用地址 → 0x7f8b</text>

  <!-- Arrow: Stack → Heap -->
  <line x1="190" y1="116" x2="278" y2="116" stroke="var(--diagram-accent-4)" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Heap -->
  <rect x="280" y="50" width="190" height="160" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="2"/>
  <text x="375" y="76" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="15">堆（Heap）</text>

  <!-- Object -->
  <rect x="300" y="92" width="150" height="100" rx="4" fill="var(--diagram-surface-1)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <rect x="300" y="92" width="150" height="28" rx="4" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1"/>
  <text x="375" y="112" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold" font-size="12">User 对象</text>
  <text x="310" y="138" fill="var(--diagram-text-2)" font-size="12">├─ 对象头</text>
  <text x="310" y="156" fill="var(--diagram-text-2)" font-size="12">├─ name: null</text>
  <text x="310" y="174" fill="var(--diagram-text-2)" font-size="12">└─ age: 0</text>

  <!-- Labels -->
  <text x="120" y="234" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">局部变量（基本类型 + 引用）</text>
  <text x="375" y="234" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">对象实例（new 出来的）</text>
</svg>