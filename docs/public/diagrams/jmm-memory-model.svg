<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" width="620" height="620">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <linearGradient id="chipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- CPU Chip outer box -->
  <rect x="15" y="10" width="590" height="410" rx="14" fill="url(#chipBg)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#4338ca">CPU 芯片</text>

  <!-- Core 0 -->
  <rect x="40" y="60" width="245" height="330" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="162" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">Core 0</text>

  <!-- L1 Cache 0 -->
  <rect x="60" y="100" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="160" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">L1 Cache</text>
  <text x="160" y="150" text-anchor="middle" font-size="12" fill="#3b82f6">（私有）</text>

  <!-- L2 Cache 0 -->
  <rect x="60" y="190" width="200" height="70" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="160" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">L2 Cache</text>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#6366f1">（私有）</text>

  <!-- Core 1 -->
  <rect x="305" y="60" width="245" height="330" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="427" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">Core 1</text>

  <!-- L1 Cache 1 -->
  <rect x="325" y="100" width="200" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="425" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">L1 Cache</text>
  <text x="425" y="150" text-anchor="middle" font-size="12" fill="#3b82f6">（私有）</text>

  <!-- L2 Cache 1 -->
  <rect x="325" y="190" width="200" height="70" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="425" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">L2 Cache</text>
  <text x="425" y="240" text-anchor="middle" font-size="12" fill="#6366f1">（私有）</text>

  <!-- Connector lines from cores to shared bus -->
  <line x1="162" y1="280" x2="162" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="427" y1="280" x2="427" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Horizontal bus -->
  <line x1="162" y1="310" x2="427" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bus label -->
  <text x="295" y="303" text-anchor="middle" font-size="10" fill="#64748b">总线</text>

  <!-- L3 Cache (shared) -->
  <rect x="120" y="320" width="350" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="295" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">L3 Cache</text>
  <text x="295" y="365" text-anchor="middle" font-size="12" fill="#d97706">（共享）</text>

  <!-- Arrow from L3 down to DRAM -->
  <line x1="295" y1="375" x2="295" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="295,440 289,432 301,432" fill="#94a3b8"/>

  <!-- Main Memory (DRAM) -->
  <rect x="145" y="450" width="300" height="55" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="295" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">主内存（DRAM）</text>

  <!-- Annotation: visibility problem -->
  <rect x="60" y="530" width="480" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="300" y="552" text-anchor="middle" font-size="12" fill="#9a3412">Core 0 写 x = 1 到 L1，不会立刻写回主内存</text>
  <text x="300" y="572" text-anchor="middle" font-size="12" fill="#9a3412">→ Core 1 从 L1 读到的可能仍是旧值 0</text>
  <text x="300" y="592" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">可见性问题的硬件根源就在这里</text>
</svg>
