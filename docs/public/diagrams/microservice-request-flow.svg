<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1050" width="780" height="1050" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
  .label { font-size: 12px; fill: #2d3436; }
  .note { font-size: 11px; fill: #636e72; }
  .arrow { stroke: #6c5ce7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: #dfe6e9; stroke: #636e72; stroke-width: 1.5; }
  .highlight { fill: #ffeaa7; stroke: #fdcb6e; stroke-width: 1.5; }
  .action { fill: #81ecec; stroke: #00b894; stroke-width: 1.5; }
  .important { fill: #fab1a0; stroke: #e17055; stroke-width: 1.5; }
  .step { fill: #a29bfe; stroke: #6c5ce7; stroke-width: 1.5; }
  .note-box { fill: #f8f9fa; stroke: #b2bec3; stroke-width: 1; }
  .cache { fill: #fdcb6e; stroke: #f39c12; stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#6c5ce7"/>
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#e17055"/>
  </marker>
</defs>
<text x="390" y="28" class="title">微服务网关请求处理流程</text>
<rect x="210" y="45" width="360" height="36" class="box phase"/>
<text x="390.0" y="63.0" class="label">客户端请求 GET /api/order/123</text>
<line x1="390" y1="81" x2="390" y2="105" class="arrow"/><rect x="50" y="105" width="680" height="520" rx="12" fill="#f0f0ff" stroke="#6c5ce7" stroke-width="2"/>
<text x="390" y="127" class="label" font-weight="bold" font-size="15" fill="#6c5ce7">API Gateway</text>
<rect x="80" y="145" width="280" height="28" class="box step"/>
<text x="220" y="159" class="label" font-weight="bold">1. 路由匹配</text>
<rect x="370" y="145" width="340" height="44" class="box note-box"/>
<text x="385" y="161" text-anchor="start" class="note">Path=/api/order/** ✓ → order-service</text>
<text x="385" y="179" text-anchor="start" class="note">Method=GET ✓</text>
<rect x="80" y="201" width="280" height="28" class="box action"/>
<text x="220" y="215" class="label" font-weight="bold">2. 全局过滤器链</text>
<rect x="370" y="201" width="340" height="62" class="box note-box"/>
<text x="385" y="217" text-anchor="start" class="note">AuthGlobalFilter → JWT 验证通过</text>
<text x="385" y="235" text-anchor="start" class="note">LogGlobalFilter → 记录请求日志</text>
<text x="385" y="253" text-anchor="start" class="note">RateLimitFilter → 限流检查通过</text>
<rect x="80" y="275" width="280" height="28" class="box highlight"/>
<text x="220" y="289" class="label" font-weight="bold">3. 路由过滤器链</text>
<rect x="370" y="275" width="340" height="44" class="box note-box"/>
<text x="385" y="291" text-anchor="start" class="note">StripPrefix=1 → /api/order/123 → /order/123</text>
<text x="385" y="309" text-anchor="start" class="note">AddRequestHeader → 添加自定义头</text>
<rect x="80" y="331" width="280" height="28" class="box cache"/>
<text x="220" y="345" class="label" font-weight="bold">4. 负载均衡选择实例</text>
<rect x="370" y="331" width="340" height="44" class="box note-box"/>
<text x="385" y="347" text-anchor="start" class="note">order-service: 3 个实例</text>
<text x="385" y="365" text-anchor="start" class="note">选择 192.168.1.20:8082</text>
<rect x="80" y="387" width="280" height="28" class="box important"/>
<text x="220" y="401" class="label" font-weight="bold">5. 转发请求</text>
<rect x="370" y="387" width="340" height="44" class="box note-box"/>
<text x="385" y="403" text-anchor="start" class="note">GET http://192.168.1.20:8082/order/123</text>
<text x="385" y="421" text-anchor="start" class="note">Header: X-User-Id: 1001</text>
<line x1="390" y1="625" x2="390" y2="645" class="arrow"/><rect x="250" y="645" width="280" height="36" class="box action"/>
<text x="390.0" y="663.0" class="label">order-service 处理并返回响应</text>
<line x1="390" y1="681" x2="390" y2="705" class="arrow"/><rect x="100" y="705" width="580" height="120" rx="12" fill="#f0fff0" stroke="#00b894" stroke-width="2"/>
<text x="390" y="727" class="label" font-weight="bold" fill="#00b894">响应处理</text>
<text x="130" y="755" text-anchor="start" class="note">6. 响应过滤器链: LogGlobalFilter → 记录响应日志</text>
<text x="130" y="777" text-anchor="start" class="note">7. 响应头添加: X-Response-Time: 45ms</text>
<text x="130" y="799" text-anchor="start" class="note">8. 返回响应给客户端</text>

</svg>