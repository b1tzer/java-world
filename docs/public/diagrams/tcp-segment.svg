<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">TCP 状态机</text>

  <!-- CLOSED -->
  <rect x="295" y="45" width="130" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="360" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">CLOSED</text>

  <!-- Arrow: CLOSED → SYN_SENT -->
  <line x1="360" y1="85" x2="360" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="105" font-size="11" fill="#3b82f6">connect()</text>

  <!-- SYN_SENT -->
  <rect x="295" y="120" width="130" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">SYN_SENT</text>

  <!-- Arrow: SYN_SENT → ESTABLISHED (center) -->
  <line x1="360" y1="160" x2="360" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="180" font-size="11" fill="#16a34a">SYN+ACK</text>

  <!-- Arrow: SYN_SENT → CLOSED (left) -->
  <path d="M295,140 L180,140 L180,65 L295,65" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="130" text-anchor="end" font-size="11" fill="#ef4444">超时重试</text>

  <!-- Arrow: SYN_SENT → CLOSED (right) -->
  <path d="M425,140 L540,140 L540,65 L425,65" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="130" font-size="11" fill="#ef4444">RST</text>

  <!-- ESTABLISHED -->
  <rect x="285" y="195" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">ESTABLISHED</text>

  <!-- Arrow: ESTABLISHED → FIN_WAIT_1 -->
  <line x1="360" y1="235" x2="360" y2="265" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="255" font-size="11" fill="#3b82f6">close()</text>

  <!-- FIN_WAIT_1 -->
  <rect x="295" y="270" width="130" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">FIN_WAIT_1</text>

  <!-- Arrow: FIN_WAIT_1 → FIN_WAIT_2 -->
  <line x1="360" y1="310" x2="360" y2="340" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="330" font-size="11" fill="#16a34a">ACK</text>

  <!-- FIN_WAIT_2 -->
  <rect x="295" y="345" width="130" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">FIN_WAIT_2</text>

  <!-- Arrow: FIN_WAIT_2 → TIME_WAIT -->
  <line x1="360" y1="385" x2="360" y2="415" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="405" font-size="11" fill="#8b5cf6">FIN</text>

  <!-- TIME_WAIT -->
  <rect x="295" y="420" width="130" height="40" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="360" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">TIME_WAIT</text>

  <!-- Arrow: TIME_WAIT → CLOSED -->
  <line x1="360" y1="460" x2="360" y2="490" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="480" font-size="11" fill="#ec4899">2MSL</text>

  <!-- Final CLOSED -->
  <rect x="295" y="490" width="130" height="30" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="360" y="510" text-anchor="middle" font-size="12" fill="#1e293b">CLOSED</text>

  <!-- Server side (right) annotations -->
  <text x="580" y="220" font-size="12" fill="#64748b">服务端正常路径：</text>
  <text x="580" y="240" font-size="12" fill="#64748b">SYN_RCVD → ESTABLISHED</text>
  <text x="580" y="260" font-size="12" fill="#64748b">→ CLOSE_WAIT → LAST_ACK</text>
  <text x="580" y="280" font-size="12" fill="#64748b">→ CLOSED</text>
</svg>