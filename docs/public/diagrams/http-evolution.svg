<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10">
  <defs>
    <marker id="arD4" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>

  <text x="390" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">HTTP 版本演进：连接建立对比</text>

  <!-- Column 1: TCP + TLS 1.2 -->
  <text x="130" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-5)">TCP + TLS 1.2（HTTP/1.1 / HTTP/2）</text>
  <g transform="translate(20, 68)">
    <rect x="0" y="0" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="20" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 → SYN</text>
    <rect x="0" y="38" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="58" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 ← SYN-ACK</text>
    <rect x="0" y="76" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="96" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 → ACK + ClientHello</text>
    <rect x="0" y="114" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="134" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 ← ServerHello + Cert</text>
    <rect x="0" y="152" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="172" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 → Finished</text>
    <rect x="0" y="190" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="210" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 → HTTP Request</text>
    <rect x="0" y="228" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="110" y="248" text-anchor="middle" fill="var(--diagram-accent-text-5)">客户端 ← HTTP Response</text>
    <!-- RTT labels -->
    <rect x="228" y="0" width="50" height="70" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="253" y="24" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-5)" font-weight="bold">1 RTT</text>
    <text x="253" y="40" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">TCP</text>
    <text x="253" y="52" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">握手</text>
    <rect x="228" y="76" width="50" height="70" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="253" y="100" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-5)" font-weight="bold">1 RTT</text>
    <text x="253" y="116" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">TLS</text>
    <text x="253" y="128" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">握手</text>
    <rect x="228" y="152" width="50" height="70" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
    <text x="253" y="176" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-5)" font-weight="bold">1 RTT</text>
    <text x="253" y="192" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">密钥</text>
    <text x="253" y="204" text-anchor="middle" font-size="8" fill="var(--diagram-accent-5)">确认</text>
    <rect x="0" y="268" width="280" height="24" rx="4" fill="var(--diagram-accent-5)" stroke="none"/>
    <text x="140" y="284" text-anchor="middle" font-size="10" fill="var(--diagram-surface-1)" font-weight="bold">总计: 3-RTT 才能拿到第一个字节</text>
  </g>

  <!-- Column 2: QUIC 首次连接 -->
  <text x="430" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-1)">QUIC 首次连接</text>
  <g transform="translate(320, 68)">
    <rect x="0" y="0" width="220" height="40" rx="4" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" fill="var(--diagram-accent-text-1)">客户端 → Initial</text>
    <text x="110" y="34" text-anchor="middle" font-size="8" fill="var(--diagram-accent-1)">（含 ClientHello）</text>
    <rect x="0" y="48" width="220" height="40" rx="4" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="110" y="66" text-anchor="middle" fill="var(--diagram-accent-text-1)">客户端 ← Handshake</text>
    <text x="110" y="82" text-anchor="middle" font-size="8" fill="var(--diagram-accent-1)">（ServerHello）</text>
    <rect x="0" y="96" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="110" y="116" text-anchor="middle" fill="var(--diagram-accent-text-1)">客户端 → HTTP Request</text>
    <rect x="0" y="134" width="220" height="32" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="110" y="154" text-anchor="middle" fill="var(--diagram-accent-text-1)">客户端 ← HTTP Response</text>
    <!-- RTT label -->
    <rect x="228" y="0" width="50" height="90" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1"/>
    <text x="253" y="30" text-anchor="middle" font-size="8" fill="var(--diagram-accent-text-1)" font-weight="bold">1 RTT</text>
    <text x="253" y="46" text-anchor="middle" font-size="8" fill="var(--diagram-accent-1)">连接</text>
    <text x="253" y="58" text-anchor="middle" font-size="8" fill="var(--diagram-accent-1)">+ 加密</text>
    <rect x="0" y="178" width="280" height="24" rx="4" fill="var(--diagram-accent-1)" stroke="none"/>
    <text x="140" y="194" text-anchor="middle" font-size="10" fill="var(--diagram-surface-1)" font-weight="bold">总计: 1-RTT</text>
  </g>

  <!-- Column 3: QUIC 后续 0-RTT -->
  <text x="680" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-2)">QUIC 后续连接（0-RTT）</text>
  <g transform="translate(580, 68)">
    <rect x="0" y="0" width="180" height="50" rx="4" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">客户端 → Initial</text>
    <text x="90" y="36" text-anchor="middle" font-size="8" fill="var(--diagram-accent-2)">+ 0-RTT Data</text>
    <text x="90" y="48" text-anchor="middle" font-size="8" fill="var(--diagram-accent-2)">（含 HTTP Request）</text>
    <line x1="90" y1="50" x2="90" y2="62" stroke="var(--diagram-accent-2)" stroke-width="1.5" marker-end="url(#arD4)"/>
    <rect x="0" y="64" width="180" height="32" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
    <text x="90" y="84" text-anchor="middle" fill="var(--diagram-accent-text-2)">客户端 ← HTTP Response</text>
    <rect x="0" y="108" width="180" height="24" rx="4" fill="var(--diagram-accent-2)" stroke="none"/>
    <text x="90" y="124" text-anchor="middle" font-size="10" fill="var(--diagram-surface-1)" font-weight="bold">0 RTT！请求和握手同时发出</text>
  </g>
</svg>
