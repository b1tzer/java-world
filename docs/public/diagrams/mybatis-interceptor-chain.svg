<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker>
  </defs>
  <text x="240" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text-1)">MyBatis 可拦截的四个对象</text>

  <!-- Box -->
  <rect x="80" y="50" width="320" height="330" rx="12" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1.5"/>

  <!-- Executor -->
  <rect x="140" y="80" width="200" height="50" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="240" y="102" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="14">Executor</text>
  <text x="240" y="120" text-anchor="middle" fill="var(--diagram-text-2)" font-size="11">SQL 执行入口</text>
  <line x1="240" y1="130" x2="240" y2="155" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- ParameterHandler -->
  <rect x="140" y="160" width="200" height="50" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="240" y="182" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="14">ParameterHandler</text>
  <text x="240" y="200" text-anchor="middle" fill="var(--diagram-text-2)" font-size="11">参数设置（? 占位符 → 实际值）</text>
  <line x1="240" y1="210" x2="240" y2="235" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- StatementHandler -->
  <rect x="140" y="240" width="200" height="50" rx="8" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="240" y="262" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold" font-size="14">StatementHandler</text>
  <text x="240" y="280" text-anchor="middle" fill="var(--diagram-text-2)" font-size="11">Statement 准备（prepare → execute）</text>
  <line x1="240" y1="290" x2="240" y2="315" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- ResultSetHandler -->
  <rect x="140" y="320" width="200" height="50" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="240" y="342" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold" font-size="14">ResultSetHandler</text>
  <text x="240" y="360" text-anchor="middle" fill="var(--diagram-text-2)" font-size="11">结果集处理（ResultSet → Java 对象）</text>

  <!-- Side note -->
  <text x="420" y="106" fill="var(--diagram-text-3)" font-size="11">← 每个都可被插件拦截</text>
  <text x="420" y="186" fill="var(--diagram-text-3)" font-size="11">← 每个都可被插件拦截</text>
  <text x="420" y="266" fill="var(--diagram-text-3)" font-size="11">← 每个都可被插件拦截</text>
  <text x="420" y="346" fill="var(--diagram-text-3)" font-size="11">← 每个都可被插件拦截</text>

  <text x="240" y="406" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">MyBatis 插件（Plugin）可以拦截这四个对象的方法调用</text>
</svg>