<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text-1)">QUIC 协议栈</text>

  <!-- Stack layers from top to bottom -->
  <!-- HTTP/3 -->
  <rect x="80" y="46" width="360" height="50" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2"/>
  <text x="260" y="66" text-anchor="middle" font-size="15" fill="var(--diagram-accent-text-1)" font-weight="bold">HTTP/3</text>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="var(--diagram-accent-1)">应用层协议（请求/响应语义）</text>

  <!-- Arrow -->
  <line x1="260" y1="96" x2="260" y2="110" stroke="var(--diagram-arrow)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- QPACK -->
  <rect x="80" y="112" width="360" height="44" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="260" y="130" text-anchor="middle" font-size="14" fill="var(--diagram-accent-text-2)" font-weight="bold">QPACK</text>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="var(--diagram-accent-2)">头部压缩（替代 HPACK）</text>

  <!-- Arrow -->
  <line x1="260" y1="156" x2="260" y2="170" stroke="var(--diagram-arrow)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- QUIC Transport -->
  <rect x="80" y="172" width="360" height="140" rx="8" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="2"/>
  <text x="260" y="194" text-anchor="middle" font-size="15" fill="var(--diagram-accent-text-4)" font-weight="bold">QUIC Transport</text>

  <!-- Sub-features inside QUIC -->
  <rect x="100" y="204" width="320" height="26" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <text x="260" y="221" text-anchor="middle" font-size="12" fill="var(--diagram-accent-4)">Stream 复用（独立可靠传输）</text>

  <rect x="100" y="236" width="320" height="26" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <text x="260" y="253" text-anchor="middle" font-size="12" fill="var(--diagram-accent-4)">0-RTT 连接建立</text>

  <rect x="100" y="268" width="320" height="26" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="var(--diagram-accent-4)">内置 TLS 1.3</text>

  <!-- Arrow -->
  <line x1="260" y1="312" x2="260" y2="326" stroke="var(--diagram-arrow)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- UDP -->
  <rect x="80" y="328" width="360" height="44" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="260" y="346" text-anchor="middle" font-size="14" fill="var(--diagram-accent-text-3)" font-weight="bold">UDP</text>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="var(--diagram-accent-3)">传输层（无连接、不可靠 → QUIC 在此之上实现可靠性）</text>

  <!-- Bottom note -->
  <rect x="80" y="384" width="360" height="28" rx="4" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="var(--diagram-text-2)">对比传统：TCP（传输）+ TLS（加密）+ HTTP（应用）三层分离</text>
</svg>
