<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">QUIC 协议栈</text>

  <!-- Stack layers from top to bottom -->
  <!-- HTTP/3 -->
  <rect x="80" y="46" width="360" height="50" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="260" y="66" text-anchor="middle" font-size="15" fill="#0D47A1" font-weight="bold">HTTP/3</text>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#1565C0">应用层协议（请求/响应语义）</text>

  <!-- Arrow -->
  <line x1="260" y1="96" x2="260" y2="110" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- QPACK -->
  <rect x="80" y="112" width="360" height="44" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="260" y="130" text-anchor="middle" font-size="14" fill="#1B5E20" font-weight="bold">QPACK</text>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#2E7D32">头部压缩（替代 HPACK）</text>

  <!-- Arrow -->
  <line x1="260" y1="156" x2="260" y2="170" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- QUIC Transport -->
  <rect x="80" y="172" width="360" height="140" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="260" y="194" text-anchor="middle" font-size="15" fill="#BF360C" font-weight="bold">QUIC Transport</text>

  <!-- Sub-features inside QUIC -->
  <rect x="100" y="204" width="320" height="26" rx="4" fill="#FFE0B2" stroke="#FF9800" stroke-width="1"/>
  <text x="260" y="221" text-anchor="middle" font-size="12" fill="#E65100">Stream 复用（独立可靠传输）</text>

  <rect x="100" y="236" width="320" height="26" rx="4" fill="#FFE0B2" stroke="#FF9800" stroke-width="1"/>
  <text x="260" y="253" text-anchor="middle" font-size="12" fill="#E65100">0-RTT 连接建立</text>

  <rect x="100" y="268" width="320" height="26" rx="4" fill="#FFE0B2" stroke="#FF9800" stroke-width="1"/>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="#E65100">内置 TLS 1.3</text>

  <!-- Arrow -->
  <line x1="260" y1="312" x2="260" y2="326" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- UDP -->
  <rect x="80" y="328" width="360" height="44" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="260" y="346" text-anchor="middle" font-size="14" fill="#4A148C" font-weight="bold">UDP</text>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#7B1FA2">传输层（无连接、不可靠 → QUIC 在此之上实现可靠性）</text>

  <!-- Bottom note -->
  <rect x="80" y="384" width="360" height="28" rx="4" fill="#EFEBE9" stroke="#795548" stroke-width="1"/>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#5D4037">对比传统：TCP（传输）+ TLS（加密）+ HTTP（应用）三层分离</text>
</svg>
