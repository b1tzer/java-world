<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>

  <!-- Layer 1: Java Language -->
  <rect x="60" y="20" width="440" height="100" rx="12" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent-text-1)">Java 语言层</text>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="var(--diagram-accent-text-1)">happens-before / volatile /</text>
  <text x="280" y="98" text-anchor="middle" font-size="13" fill="var(--diagram-accent-text-1)">synchronized / final</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="120" x2="280" y2="170" stroke="var(--diagram-arrow)" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="var(--diagram-text-2)" font-weight="bold">语义翻译</text>

  <!-- Layer 2: JVM / JIT -->
  <rect x="60" y="178" width="440" height="100" rx="12" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent-text-2)">JVM / JIT</text>
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="var(--diagram-accent-text-2)">在合适位置插入屏障与顺序约束</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="var(--diagram-accent-2)">StoreStore / LoadLoad / StoreLoad / LoadStore</text>

  <!-- Arrow 2 -->
  <line x1="280" y1="278" x2="280" y2="328" stroke="var(--diagram-arrow)" stroke-width="2.5" marker-end="url(#arrowDown)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="var(--diagram-text-2)" font-weight="bold">指令执行</text>

  <!-- Layer 3: CPU -->
  <rect x="60" y="336" width="440" height="100" rx="12" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent-text-5)">CPU</text>
  <text x="280" y="395" text-anchor="middle" font-size="13" fill="var(--diagram-accent-text-5)">缓存 / 一致性协议 / 乱序执行</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="var(--diagram-accent-5)">x86(TSO) / ARM(弱) / RISC-V(可配置)</text>

  <!-- Side annotation -->
  <rect x="510" y="180" width="40" height="250" rx="4" fill="none" stroke="var(--diagram-stroke-2)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="530" y="310" text-anchor="middle" font-size="10" fill="var(--diagram-arrow)" writing-mode="tb">三层协作是 Java 并发能被推理的物理基础</text>
</svg>
