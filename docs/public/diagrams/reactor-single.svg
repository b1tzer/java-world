<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text-1)">单线程 Reactor 模式</text>
  <rect x="40" y="50" width="440" height="200" rx="12" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="2"/>
  <text x="260" y="76" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold" font-size="15">Reactor Thread（单线程）</text>
  <!-- Selector -->
  <rect x="70" y="100" width="110" height="50" rx="6" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="125" y="122" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">Selector</text>
  <text x="125" y="138" text-anchor="middle" fill="var(--diagram-text-2)" font-size="11">select()</text>
  <!-- Dispatcher -->
  <rect x="220" y="100" width="110" height="50" rx="6" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="275" y="122" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">Dispatcher</text>
  <text x="275" y="138" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">分发事件</text>
  <!-- Handler -->
  <rect x="370" y="85" width="90" height="140" rx="6" fill="var(--diagram-accent-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="415" y="108" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">Handler</text>
  <text x="415" y="130" text-anchor="middle" fill="var(--diagram-accent-bg-3b)" font-size="11">read</text>
  <text x="415" y="148" text-anchor="middle" fill="var(--diagram-accent-bg-3b)" font-size="11">decode</text>
  <text x="415" y="166" text-anchor="middle" fill="var(--diagram-accent-bg-3b)" font-size="11">process</text>
  <text x="415" y="184" text-anchor="middle" fill="var(--diagram-accent-bg-3b)" font-size="11">encode</text>
  <text x="415" y="202" text-anchor="middle" fill="var(--diagram-accent-bg-3b)" font-size="11">write</text>
  <!-- Arrows -->
  <line x1="180" y1="125" x2="218" y2="125" stroke="var(--diagram-accent-3)" stroke-width="1.5" marker-end="url(#ar3)"/>
  <line x1="330" y1="125" x2="368" y2="125" stroke="var(--diagram-accent-3)" stroke-width="1.5" marker-end="url(#ar3)"/>
  <!-- Note -->
  <text x="260" y="276" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">所有 I/O 事件的检测和处理都在同一个线程中完成</text>
  <text x="260" y="294" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-size="11">⚠ 业务逻辑处理会阻塞 Selector，导致其他连接事件无法及时处理</text>
  <defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-3)"/></marker></defs>
</svg>