<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-1)"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-2)"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-5)"/>
    </marker>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A6FA5"/>
      <stop offset="100%" style="stop-color:#5B8DEF"/>
    </linearGradient>
  </defs>

  <!-- Entry -->
  <rect x="120" y="20" width="260" height="42" rx="6" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="250" y="47" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-size="14" font-weight="bold">客户端调用 createOrder()</text>

  <line x1="250" y1="62" x2="250" y2="82" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#a1)"/>

  <!-- AOP Proxy -->
  <rect x="100" y="84" width="300" height="50" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="250" y="115" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="14" font-weight="bold">AOP Proxy 拦截（JDK/CGLIB）</text>
  <text x="410" y="115" fill="var(--diagram-text-3)" font-size="11">← Spring 生成的代理对象</text>

  <line x1="250" y1="134" x2="250" y2="154" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#a1)"/>

  <!-- TransactionInterceptor -->
  <rect x="80" y="156" width="340" height="90" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="250" y="180" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="13" font-weight="bold">TransactionInterceptor.intercept()</text>
  <text x="250" y="200" text-anchor="middle" fill="var(--diagram-text-2)" font-size="12">1. 获取事务属性 ← 读取 @Transactional 注解参数</text>
  <text x="250" y="218" text-anchor="middle" fill="var(--diagram-text-2)" font-size="12">2. 获取事务管理器 ← PlatformTransactionManager</text>
  <text x="250" y="236" text-anchor="middle" fill="var(--diagram-text-2)" font-size="12">3. 创建/加入事务 ← txManager.getTransaction()</text>

  <line x1="250" y1="246" x2="250" y2="268" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Business Method -->
  <rect x="100" y="270" width="300" height="50" rx="6" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="250" y="300" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-size="14" font-weight="bold">执行真实业务方法</text>
  <text x="410" y="300" fill="var(--diagram-text-3)" font-size="11">← orderDao.insert() 等</text>

  <line x1="250" y1="320" x2="250" y2="348" stroke="var(--diagram-accent-1)" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Decision -->
  <polygon points="250,350 320,385 250,420 180,385" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="250" y="390" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="13" font-weight="bold">成功？</text>

  <!-- Yes path -->
  <line x1="320" y1="385" x2="390" y2="385" stroke="var(--diagram-accent-2)" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="345" y="378" fill="var(--diagram-accent-2)" font-size="12" font-weight="bold">Yes</text>
  <rect x="392" y="365" width="90" height="40" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="437" y="390" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="13" font-weight="bold">commit()</text>

  <!-- No path -->
  <line x1="180" y1="385" x2="110" y2="385" stroke="var(--diagram-accent-5)" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="135" y="378" fill="var(--diagram-accent-5)" font-size="12" font-weight="bold">No</text>
  <rect x="10" y="365" width="98" height="40" rx="6" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="59" y="383" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-size="12" font-weight="bold">rollback()</text>
  <text x="59" y="398" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">RuntimeException</text>

  <!-- Both converge to release -->
  <line x1="437" y1="405" x2="437" y2="445" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="59" y1="405" x2="59" y2="445" stroke="var(--diagram-text-2)" stroke-width="1.5"/>
  <line x1="59" y1="445" x2="250" y2="445" stroke="var(--diagram-text-2)" stroke-width="1.5"/>
  <line x1="437" y1="445" x2="250" y2="445" stroke="var(--diagram-text-2)" stroke-width="1.5"/>
  <line x1="250" y1="445" x2="250" y2="465" stroke="var(--diagram-text-2)" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="150" y="467" width="200" height="42" rx="6" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1.5"/>
  <text x="250" y="493" text-anchor="middle" fill="var(--diagram-text-1)" font-size="14" font-weight="bold">释放连接</text>
</svg>