<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-back" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:#333}
    .title{font-size:16px;font-weight:bold;fill:#1a1a2e}
    .node-label{font-size:13px;fill:#1e3a5f}
    .loop-label{fill:#7c3aed;font-size:12px;font-weight:bold}
    .hint{fill:#6b7280;font-size:12px}
  </style>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" class="title">新建 Worker —— 生命周期流程</text>

  <!-- Step 1: 新建 Worker -->
  <rect x="240" y="48" rx="8" width="200" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="73" text-anchor="middle" class="node-label">新建 Worker</text>

  <line x1="340" y1="88" x2="340" y2="118" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: 执行 firstTask -->
  <rect x="220" y="118" rx="8" width="240" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="143" text-anchor="middle" fill="#15803d">执行 firstTask（构造时传入的任务）</text>

  <line x1="340" y1="158" x2="340" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: 从 workQueue 取任务 -->
  <rect x="190" y="190" rx="8" width="300" height="40" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="340" y="215" text-anchor="middle" fill="#854d0e">从 workQueue 取下一个任务</text>

  <!-- Loop-back arrow (right side, going up) -->
  <path d="M490,210 C540,210 540,138 440,138" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="545" y="175" class="loop-label">循环</text>

  <line x1="340" y1="230" x2="340" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision: 取到任务？ -->
  <polygon points="340,260 470,300 340,340 210,300" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="340" y="305" text-anchor="middle" fill="#854d0e" font-size="13px">取到任务？</text>

  <!-- Yes → 执行任务 → 回到取任务 -->
  <line x1="210" y1="300" x2="110" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="165" y="292" fill="#16a34a" font-size="13px" font-weight="bold">是</text>
  <rect x="20" y="280" rx="6" width="130" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="85" y="305" text-anchor="middle" fill="#15803d">执行任务</text>

  <!-- Arrow from 执行任务 back up to 取任务 -->
  <path d="M85,280 L85,210 L190,210" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr)"/>

  <!-- No → 是否核心线程？ -->
  <line x1="340" y1="340" x2="340" y2="375" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="363" fill="#dc2626" font-size="13px" font-weight="bold">否</text>

  <!-- Decision: 核心线程？ -->
  <polygon points="340,375 460,415 340,455 220,415" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="340" y="420" text-anchor="middle" fill="#854d0e" font-size="13px">是否核心线程？</text>

  <!-- Yes → 继续 poll -->
  <line x1="220" y1="415" x2="110" y2="415" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="170" y="407" fill="#16a34a" font-size="13px" font-weight="bold">是</text>
  <rect x="10" y="395" rx="6" width="140" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="413" text-anchor="middle" fill="#15803d">继续 poll</text>
  <text x="80" y="429" text-anchor="middle" class="hint">（默认不超时）</text>

  <!-- No → poll 超时退出 -->
  <line x1="460" y1="415" x2="540" y2="415" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500" y="407" fill="#dc2626" font-size="13px" font-weight="bold">否</text>
  <rect x="540" y="395" rx="6" width="120" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="413" text-anchor="middle" fill="#b91c1c">poll(keepAliveTime)</text>
  <text x="600" y="429" text-anchor="middle" class="hint">超时后退出</text>

  <!-- Note -->
  <text x="340" y="500" text-anchor="middle" fill="#2563eb" font-size="12px" font-style="italic">allowCoreThreadTimeOut(true) 会让核心线程也走带超时的 poll</text>
</svg>
