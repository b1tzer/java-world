<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>
  <style>
    text{font-size:14px;fill:var(--diagram-text-1)}
    .title{font-size:16px;font-weight:bold;fill:var(--diagram-text-1)}
    .dec{font-size:13px;fill:var(--diagram-accent-text-4)}
    .yes{fill:var(--diagram-accent-2);font-size:13px;font-weight:bold}
    .no{fill:var(--diagram-accent-5);font-size:13px;font-weight:bold}
    .hint{fill:var(--diagram-text-2);font-size:12px}
  </style>

  <text x="390" y="30" text-anchor="middle" class="title">虚拟线程选型决策树</text>

  <!-- Root decision -->
  <polygon points="390,45 570,85 390,125 210,85" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="390" y="82" text-anchor="middle" class="dec">任务是 CPU 密集吗？</text>

  <!-- Yes branch (left) -->
  <line x1="210" y1="85" x2="100" y2="85" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="160" y="77" class="yes">是</text>
  <rect x="10" y="65" rx="6" width="130" height="44" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="75" y="83" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">平台线程池</text>
  <text x="75" y="100" text-anchor="middle" class="hint">(N_CPU + 1)</text>

  <!-- No branch (down) -->
  <line x1="390" y1="125" x2="390" y2="160" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="400" y="148" class="no">否</text>

  <!-- Decision 2 -->
  <polygon points="390,160 590,200 390,240 190,200" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="390" y="196" text-anchor="middle" class="dec">用了 synchronized + 阻塞 IO？</text>

  <!-- Yes branch -->
  <line x1="190" y1="200" x2="100" y2="200" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="150" y="192" class="yes">是</text>

  <!-- Decision 3: JDK version -->
  <polygon points="100,200 100,175 100,225 0,200" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <rect x="10" y="175" rx="6" width="130" height="50" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="75" y="196" text-anchor="middle" class="dec">JDK &lt; 24？</text>

  <!-- JDK < 24: yes (left-down) -->
  <line x1="30" y1="225" x2="30" y2="270" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="38" y="252" class="yes">是</text>
  <rect x="0" y="270" rx="6" width="160" height="56" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="80" y="290" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">改 ReentrantLock</text>
  <text x="80" y="306" text-anchor="middle" class="hint">或使用平台线程</text>

  <!-- JDK >= 24: no (right) -->
  <line x1="140" y1="200" x2="210" y2="200" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="170" y="192" class="no">否</text>
  <rect x="210" y="182" rx="6" width="100" height="36" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="260" y="205" text-anchor="middle" fill="var(--diagram-accent-text-2)">虚拟线程</text>

  <!-- No branch from decision 2 (right) -->
  <line x1="590" y1="200" x2="670" y2="200" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="630" y="192" class="no">否</text>

  <!-- Virtual thread area -->
  <rect x="670" y="182" rx="6" width="90" height="36" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="715" y="205" text-anchor="middle" fill="var(--diagram-accent-text-2)">虚拟线程</text>

  <!-- Arrow down from virtual thread -->
  <line x1="715" y1="218" x2="715" y2="260" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Decision 4: 背压 -->
  <polygon points="715,260 820,295 715,330 610,295" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="715" y="292" text-anchor="middle" class="dec" font-size="12px">还需要背压吗？</text>

  <!-- Yes: VT + Semaphore -->
  <line x1="610" y1="295" x2="530" y2="295" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="570" y="287" class="yes">是</text>
  <rect x="380" y="275" rx="6" width="150" height="40" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="455" y="292" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">VT + Semaphore</text>
  <text x="455" y="308" text-anchor="middle" class="hint">显式限流</text>

  <!-- No: 直接用 VT -->
  <line x1="715" y1="330" x2="715" y2="355" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="725" y="348" class="no">否</text>
  <rect x="655" y="355" rx="6" width="120" height="36" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="715" y="378" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">直接用 VT</text>

  <!-- Legend / summary box -->
  <rect x="80" y="390" rx="8" width="620" height="200" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="100" y="418" class="title" font-size="14px">速查表</text>
  <text x="100" y="445" fill="var(--diagram-accent-text-2)" font-size="13px">✅  IO 密集（DB / RPC / HTTP）→ 虚拟线程，无需调参</text>
  <text x="100" y="470" fill="var(--diagram-accent-text-2)" font-size="13px">✅  IO 密集 + 需要限流 → 虚拟线程 + Semaphore</text>
  <text x="100" y="495" fill="var(--diagram-accent-text-2)" font-size="13px">✅  CPU 密集 → 平台线程池（N_CPU + 1），虚拟线程无收益</text>
  <text x="100" y="520" fill="var(--diagram-accent-5)" font-size="13px">⚠️  synchronized + 阻塞 IO（JDK &lt; 24）→ 改 ReentrantLock 或用平台线程</text>
  <text x="100" y="545" fill="var(--diagram-text-2)" font-size="13px">💡  定时任务、需要线程亲和性的库 → 仍用平台线程池</text>
  <text x="100" y="570" fill="var(--diagram-text-2)" font-size="13px">💡  ThreadLocal 密集 → 注意百万 VT 的内存开销，考虑 ScopedValue</text>
</svg>
