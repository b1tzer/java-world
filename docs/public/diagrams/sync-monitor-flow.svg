<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="var(--diagram-accent-2)"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="var(--diagram-accent-5)"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="var(--diagram-text-2)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text-1)">Monitor 工作流程：synchronized 字节码执行</text>

  <!-- Bytecode source box -->
  <rect x="20" y="45" width="280" height="180" rx="8" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="160" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">javap -c 反编译</text>
  <text x="35" y="88" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">public void syncBlock();</text>
  <text x="35" y="104" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">  Code:</text>
  <text x="35" y="120" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">    6: <tspan font-weight="bold" fill="var(--diagram-accent-text-1)">monitorenter</tspan>   ← 获取监视器</text>
  <text x="35" y="136" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">    8: invokevirtual #3  doSomething()</text>
  <text x="35" y="152" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   12: <tspan font-weight="bold" fill="var(--diagram-accent-2)">monitorexit</tspan>    ← 正常释放</text>
  <text x="35" y="168" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   16: astore_2  (异常)</text>
  <text x="35" y="184" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   18: <tspan font-weight="bold" fill="var(--diagram-accent-5)">monitorexit</tspan>    ← 异常也释放!</text>
  <text x="35" y="200" font-family="monospace" font-size="10.5" fill="var(--diagram-text-2)">   20: athrow</text>
  <text x="35" y="218" font-size="10" fill="var(--diagram-text-3)">编译器保证生成两个 monitorexit</text>

  <!-- ObjectMonitor box -->
  <rect x="340" y="45" width="280" height="240" rx="10" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-accent-text-3)">ObjectMonitor</text>

  <!-- _owner -->
  <rect x="360" y="82" width="240" height="36" rx="6" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="1"/>
  <text x="375" y="100" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-3)">_owner</text>
  <text x="375" y="114" font-size="10" fill="var(--diagram-accent-text-3)">当前持锁线程 (CAS 写入)</text>
  <text x="575" y="105" text-anchor="end" font-family="monospace" font-size="11" fill="var(--diagram-accent-3)">Thread-A</text>

  <!-- _recursions -->
  <rect x="360" y="124" width="240" height="30" rx="6" fill="var(--diagram-accent-bg-3b)" stroke="var(--diagram-accent-3)" stroke-width="1"/>
  <text x="375" y="144" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-3)">_recursions</text>
  <text x="575" y="144" text-anchor="end" font-family="monospace" font-size="11" fill="var(--diagram-accent-3)">重入计数: 1</text>

  <!-- _EntryList -->
  <rect x="360" y="162" width="240" height="40" rx="6" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <text x="375" y="178" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-5)">_EntryList</text>
  <text x="375" y="195" font-size="10" fill="var(--diagram-accent-5)">等锁队列 → BLOCKED</text>
  <text x="575" y="187" text-anchor="end" font-family="monospace" font-size="11" fill="var(--diagram-accent-5)">[B, D, ...]</text>

  <!-- _WaitSet -->
  <rect x="360" y="210" width="240" height="40" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <text x="375" y="226" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-4)">_WaitSet</text>
  <text x="375" y="243" font-size="10" fill="var(--diagram-accent-4)">等待队列 → WAITING</text>
  <text x="575" y="235" text-anchor="end" font-family="monospace" font-size="11" fill="var(--diagram-accent-4)">[C, E, ...]</text>

  <!-- Flow section title -->
  <text x="320" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-text-1)">执行流程</text>

  <!-- Step boxes -->
  <!-- Step 1 -->
  <rect x="30" y="330" width="170" height="50" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="115" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-1)">① monitorenter</text>
  <text x="115" y="370" text-anchor="middle" font-size="10" fill="var(--diagram-accent-1)">CAS 抢占 _owner</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="355" x2="230" y2="355" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 2 -->
  <rect x="235" y="330" width="170" height="50" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">② 执行临界区</text>
  <text x="320" y="370" text-anchor="middle" font-size="10" fill="var(--diagram-accent-2)">doSomething()</text>

  <!-- Arrow 2→3 -->
  <line x1="405" y1="355" x2="435" y2="355" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Step 3 normal -->
  <rect x="440" y="330" width="170" height="50" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="525" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">③a monitorexit</text>
  <text x="525" y="370" text-anchor="middle" font-size="10" fill="var(--diagram-accent-2)">正常释放锁</text>

  <!-- Exception path -->
  <rect x="235" y="400" width="170" height="50" rx="8" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="320" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-5)">③b monitorexit</text>
  <text x="320" y="440" text-anchor="middle" font-size="10" fill="var(--diagram-accent-5)">异常路径也要释放</text>

  <!-- Arrow from step 2 down to exception -->
  <line x1="320" y1="380" x2="320" y2="400" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="335" y="395" font-size="9" fill="var(--diagram-accent-5)">异常</text>

  <!-- Arrow from step 2 to normal exit -->
  <line x1="405" y1="345" x2="435" y2="345" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Key insight callout -->
  <rect x="30" y="470" width="580" height="70" rx="8" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="320" y="493" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-4)">关键设计：synchronized 天然不会漏解锁</text>
  <text x="320" y="513" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-4)">编译器保证生成两个 monitorexit（正常 + 异常），与手写 lock.lock()/unlock() 的核心差异</text>
  <text x="320" y="533" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-4)">锁属于对象，不属于代码块 → 每个 Java 对象都能当锁</text>
</svg>
