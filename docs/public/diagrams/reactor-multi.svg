<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">多线程 Reactor 模式</text>
  <!-- Main Reactor -->
  <rect x="100" y="50" width="320" height="80" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="260" y="76" text-anchor="middle" fill="#4A148C" font-weight="bold" font-size="15">Main Reactor Thread</text>
  <text x="260" y="96" text-anchor="middle" fill="#666" font-size="12">Selector.select() — 只处理 ACCEPT 和 READ 事件</text>
  <text x="260" y="116" text-anchor="middle" fill="#888" font-size="11">Accept → 注册 READ | Read → 提交给 Worker Pool</text>
  <!-- Arrow down -->
  <line x1="260" y1="130" x2="260" y2="170" stroke="#7B1FA2" stroke-width="2" marker-end="url(#ar4)"/>
  <!-- Worker Pool -->
  <rect x="60" y="175" width="400" height="170" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="260" y="200" text-anchor="middle" fill="#1B5E20" font-weight="bold" font-size="15">Worker Thread Pool</text>
  <!-- Workers -->
  <rect x="90" y="220" width="110" height="100" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="145" y="245" text-anchor="middle" fill="#1B5E20" font-weight="bold">Thread-1</text>
  <text x="145" y="265" text-anchor="middle" fill="#555" font-size="11">decode</text>
  <text x="145" y="283" text-anchor="middle" fill="#555" font-size="11">process</text>
  <text x="145" y="301" text-anchor="middle" fill="#555" font-size="11">encode + write</text>
  <rect x="210" y="220" width="110" height="100" rx="6" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="265" y="245" text-anchor="middle" fill="#1B5E20" font-weight="bold">Thread-2</text>
  <text x="265" y="265" text-anchor="middle" fill="#555" font-size="11">decode</text>
  <text x="265" y="283" text-anchor="middle" fill="#555" font-size="11">process</text>
  <text x="265" y="301" text-anchor="middle" fill="#555" font-size="11">encode + write</text>
  <rect x="330" y="220" width="110" height="100" rx="6" fill="#ECEFF1" stroke="#BDBDBD" stroke-width="1"/>
  <text x="385" y="265" text-anchor="middle" fill="#999">...</text>
  <!-- Footer -->
  <text x="260" y="370" text-anchor="middle" fill="#888" font-size="12">Reactor 线程只负责事件检测和分发，业务逻辑交给 Worker 线程池处理</text>
  <defs><marker id="ar4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7B1FA2"/></marker></defs>
</svg>