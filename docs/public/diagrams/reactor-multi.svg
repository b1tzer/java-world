<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <text x="260" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">多线程 Reactor 模式</text>
  <!-- Main Reactor -->
  <rect x="100" y="50" width="320" height="80" rx="10" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="2"/>
  <text x="260" y="76" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold" font-size="11">Main Reactor Thread</text>
  <text x="260" y="96" text-anchor="middle" fill="var(--diagram-text-2)" font-size="10">Selector.select() — 只处理 ACCEPT 和 READ 事件</text>
  <text x="260" y="116" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">Accept → 注册 READ | Read → 提交给 Worker Pool</text>
  <!-- Arrow down -->
  <line x1="260" y1="130" x2="260" y2="170" stroke="var(--diagram-accent-3)" stroke-width="2" marker-end="url(#ar4)"/>
  <!-- Worker Pool -->
  <rect x="60" y="175" width="400" height="170" rx="10" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="2"/>
  <text x="260" y="200" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="11">Worker Thread Pool</text>
  <!-- Workers -->
  <rect x="90" y="220" width="110" height="100" rx="6" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="145" y="245" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Thread-1</text>
  <text x="145" y="265" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">decode</text>
  <text x="145" y="283" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">process</text>
  <text x="145" y="301" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">encode + write</text>
  <rect x="210" y="220" width="110" height="100" rx="6" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="265" y="245" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Thread-2</text>
  <text x="265" y="265" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">decode</text>
  <text x="265" y="283" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">process</text>
  <text x="265" y="301" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">encode + write</text>
  <rect x="330" y="220" width="110" height="100" rx="6" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="385" y="265" text-anchor="middle" fill="var(--diagram-ghost)">...</text>
  <!-- Footer -->
  <text x="260" y="370" text-anchor="middle" fill="var(--diagram-text-3)" font-size="10">Reactor 线程只负责事件检测和分发，业务逻辑交给 Worker 线程池处理</text>
  <defs><marker id="ar4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-accent-3)"/></marker></defs>
</svg>