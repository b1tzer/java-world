<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="240" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text-1)">Java 类型体系</text>

  <!-- Root: Type -->
  <rect x="170" y="48" width="140" height="44" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2"/>
  <text x="240" y="76" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="15">Type</text>

  <!-- Branch lines -->
  <line x1="200" y1="92" x2="120" y2="130" stroke="var(--diagram-arrow)" stroke-width="1.5"/>
  <line x1="280" y1="92" x2="360" y2="130" stroke="var(--diagram-arrow)" stroke-width="1.5"/>

  <!-- Primitive -->
  <rect x="40" y="132" width="160" height="44" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="120" y="160" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Primitive</text>

  <!-- Reference -->
  <rect x="280" y="132" width="160" height="44" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="360" y="160" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">Reference</text>

  <!-- Primitive types -->
  <line x1="80" y1="176" x2="80" y2="200" stroke="var(--diagram-arrow)" stroke-width="1"/>
  <line x1="120" y1="176" x2="120" y2="200" stroke="var(--diagram-arrow)" stroke-width="1"/>
  <line x1="160" y1="176" x2="160" y2="200" stroke="var(--diagram-arrow)" stroke-width="1"/>

  <rect x="40" y="202" width="36" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="58" y="222" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">int</text>
  <rect x="82" y="202" width="36" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="100" y="222" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">long</text>
  <rect x="124" y="202" width="52" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="150" y="222" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">double</text>
  <rect x="40" y="238" width="52" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="66" y="258" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">boolean</text>
  <rect x="98" y="238" width="36" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="116" y="258" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">char</text>
  <rect x="140" y="238" width="24" height="30" rx="4" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="152" y="258" text-anchor="middle" fill="var(--diagram-ghost)" font-size="11">...</text>

  <!-- Reference types -->
  <line x1="320" y1="176" x2="320" y2="200" stroke="var(--diagram-arrow)" stroke-width="1"/>
  <line x1="360" y1="176" x2="360" y2="200" stroke="var(--diagram-arrow)" stroke-width="1"/>
  <line x1="400" y1="176" x2="400" y2="200" stroke="var(--diagram-arrow)" stroke-width="1"/>

  <rect x="292" y="202" width="56" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="320" y="222" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">Class</text>
  <rect x="332" y="202" width="56" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="360" y="222" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">Interface</text>
  <rect x="378" y="202" width="44" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="400" y="222" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">Array</text>
  <rect x="292" y="238" width="44" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="314" y="258" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">Enum</text>
  <rect x="342" y="238" width="56" height="30" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="370" y="258" text-anchor="middle" fill="var(--diagram-text-1)" font-size="11">Record</text>
  <rect x="404" y="238" width="24" height="30" rx="4" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1"/>
  <text x="416" y="258" text-anchor="middle" fill="var(--diagram-ghost)" font-size="11">...</text>

  <!-- Footer -->
  <text x="240" y="310" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">8 种基本类型是值类型，其余一切皆对象（引用类型）</text>
</svg>