<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="220" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text-1)">Java 程序的执行流程</text>

  <!-- Step 1: Source -->
  <rect x="100" y="48" width="240" height="44" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="220" y="76" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">Hello.java（源码）</text>
  <line x1="220" y1="92" x2="220" y2="118" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="236" y="110" fill="var(--diagram-text-3)" font-size="11">javac 编译</text>

  <!-- Step 2: Bytecode -->
  <rect x="100" y="122" width="240" height="44" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="220" y="150" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Hello.class（字节码）</text>
  <line x1="220" y1="166" x2="220" y2="192" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="236" y="184" fill="var(--diagram-text-3)" font-size="11">JVM 加载</text>

  <!-- Step 3: ClassLoader -->
  <rect x="100" y="196" width="240" height="44" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="220" y="224" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">ClassLoader 加载字节码</text>
  <line x1="220" y1="240" x2="220" y2="266" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4: JVM verify -->
  <rect x="100" y="270" width="240" height="44" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="220" y="298" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">JVM 验证、准备、初始化</text>
  <line x1="220" y1="314" x2="220" y2="340" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 5: Interpret/JIT -->
  <rect x="100" y="344" width="240" height="44" rx="8" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="220" y="372" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold">解释执行 / JIT 编译</text>
  <line x1="220" y1="388" x2="220" y2="414" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 6: CPU -->
  <rect x="100" y="418" width="240" height="44" rx="8" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="220" y="446" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">CPU 执行机器码</text>

  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker></defs>
</svg>