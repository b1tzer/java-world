<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B8DEF"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A6FA5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5B8DEF;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Left: Java Object Graph -->
  <rect x="20" y="20" width="260" height="48" rx="6" fill="url(#headerGrad)"/>
  <text x="150" y="50" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Java 对象图</text>

  <rect x="30" y="85" width="120" height="40" rx="5" fill="#E8F0FE" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="90" y="110" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Order</text>

  <!-- buyer → User -->
  <line x1="150" y1="105" x2="195" y2="105" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="195" y="85" width="70" height="40" rx="5" fill="#E8F0FE" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="230" y="110" text-anchor="middle" fill="#333" font-size="13">User</text>

  <!-- Order → address (via User) -->
  <line x1="230" y1="125" x2="230" y2="155" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="145" fill="#666" font-size="11">address</text>
  <rect x="195" y="155" width="70" height="40" rx="5" fill="#E8F0FE" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="230" y="180" text-anchor="middle" fill="#333" font-size="12">Address</text>

  <!-- Order → items -->
  <line x1="90" y1="125" x2="90" y2="155" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="108" y="145" fill="#666" font-size="11">items</text>
  <rect x="40" y="155" width="100" height="40" rx="5" fill="#E8F0FE" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="90" y="180" text-anchor="middle" fill="#333" font-size="12">List&lt;OrderItem&gt;</text>

  <rect x="50" y="210" width="80" height="32" rx="4" fill="#F0F4FF" stroke="#A0B4D0" stroke-width="1"/>
  <text x="90" y="230" text-anchor="middle" fill="#555" font-size="11">OrderItem</text>
  <rect x="50" y="250" width="80" height="32" rx="4" fill="#F0F4FF" stroke="#A0B4D0" stroke-width="1"/>
  <text x="90" y="270" text-anchor="middle" fill="#555" font-size="11">OrderItem</text>

  <!-- Right: Database Tables -->
  <rect x="380" y="20" width="420" height="48" rx="6" fill="url(#headerGrad)"/>
  <text x="590" y="50" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">关系数据库表结构</text>

  <!-- orders table -->
  <rect x="380" y="85" width="200" height="24" rx="3" fill="#4A6FA5"/>
  <text x="480" y="102" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">orders 表</text>
  <rect x="380" y="109" width="200" height="75" rx="0" fill="#F7FAFF" stroke="#C0CDE0" stroke-width="1"/>
  <text x="405" y="128" fill="#333" font-size="12">┌────┬──────────┬────────┐</text>
  <text x="405" y="145" fill="#333" font-size="12">│ id │ buyer_id │ status │</text>
  <text x="405" y="162" fill="#333" font-size="12">│ 1  │   100    │ PAID   │</text>
  <text x="405" y="177" fill="#333" font-size="12">└────┴──────────┴────────┘</text>

  <!-- FK arrow -->
  <line x1="480" y1="184" x2="480" y2="210" stroke="#E85D75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="200" fill="#E85D75" font-size="11" font-weight="bold">外键关联</text>

  <!-- users table -->
  <rect x="380" y="215" width="200" height="24" rx="3" fill="#4A6FA5"/>
  <text x="480" y="232" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">users 表</text>
  <rect x="380" y="239" width="200" height="75" rx="0" fill="#F7FAFF" stroke="#C0CDE0" stroke-width="1"/>
  <text x="405" y="258" fill="#333" font-size="12">┌────┬──────┬─────┐</text>
  <text x="405" y="275" fill="#333" font-size="12">│ id │ name │addr │</text>
  <text x="405" y="292" fill="#333" font-size="12">│100 │ 张三 │  5  │</text>
  <text x="405" y="307" fill="#333" font-size="12">└────┴──────┴─────┘</text>

  <!-- FK arrow -->
  <line x1="480" y1="314" x2="480" y2="340" stroke="#E85D75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="330" fill="#E85D75" font-size="11" font-weight="bold">外键关联</text>

  <!-- addresses table -->
  <rect x="380" y="345" width="200" height="24" rx="3" fill="#4A6FA5"/>
  <text x="480" y="362" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">addresses 表</text>
  <rect x="380" y="369" width="200" height="75" rx="0" fill="#F7FAFF" stroke="#C0CDE0" stroke-width="1"/>
  <text x="405" y="388" fill="#333" font-size="12">┌────┬──────┬──────┐</text>
  <text x="405" y="405" fill="#333" font-size="12">│ id │ city │ ...  │</text>
  <text x="405" y="422" fill="#333" font-size="12">│  5 │ 北京 │ ...  │</text>
  <text x="405" y="437" fill="#333" font-size="12">└────┴──────┴──────┘</text>

  <!-- Mapping label -->
  <rect x="300" y="160" width="80" height="36" rx="18" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="340" y="183" text-anchor="middle" fill="#E65100" font-size="12" font-weight="bold">ORM 映射</text>

  <!-- Dashed mapping lines -->
  <line x1="130" y1="105" x2="300" y2="105" stroke="#FF9800" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="130" y1="170" x2="300" y2="250" stroke="#FF9800" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="230" y1="175" x2="300" y2="280" stroke="#FF9800" stroke-width="1" stroke-dasharray="5,3"/>
</svg>