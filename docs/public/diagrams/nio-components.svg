<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">NIO 三大核心组件</text>
  <!-- Channel -->
  <rect x="40" y="80" width="140" height="100" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" fill="#0D47A1" font-weight="bold" font-size="16">Channel</text>
  <text x="110" y="145" text-anchor="middle" fill="#555" font-size="13">双向数据通道</text>
  <text x="110" y="165" text-anchor="middle" fill="#888" font-size="11">替代 Stream</text>
  <!-- Buffer -->
  <rect x="210" y="80" width="140" height="100" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="280" y="120" text-anchor="middle" fill="#1B5E20" font-weight="bold" font-size="16">Buffer</text>
  <text x="280" y="145" text-anchor="middle" fill="#555" font-size="13">数据读写容器</text>
  <text x="280" y="165" text-anchor="middle" fill="#888" font-size="11">所有 I/O 经过 Buffer</text>
  <!-- Selector -->
  <rect x="380" y="80" width="140" height="100" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="450" y="120" text-anchor="middle" fill="#4A148C" font-weight="bold" font-size="16">Selector</text>
  <text x="450" y="145" text-anchor="middle" fill="#555" font-size="13">事件多路复用器</text>
  <text x="450" y="165" text-anchor="middle" fill="#888" font-size="11">一个线程管理 N 连接</text>
  <!-- Arrows: Channel ↔ Buffer -->
  <line x1="180" y1="120" x2="208" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="212" y1="135" x2="184" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- Arrow: Channel → Selector (register) -->
  <path d="M110,180 L110,230 L450,230 L450,182" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ar)"/>
  <text x="280" y="248" text-anchor="middle" fill="#7B1FA2" font-size="12">注册 + 关注事件</text>
  <!-- Footer -->
  <text x="280" y="290" text-anchor="middle" fill="#888" font-size="12">Channel 通过 Buffer 读写数据，通过 Selector 监听事件</text>
  <text x="280" y="308" text-anchor="middle" fill="#888" font-size="12">三者协作，实现"一个线程管理万千连接"</text>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555"/></marker></defs>
</svg>