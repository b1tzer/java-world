<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="800" height="880" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
  .label { font-size: 12px; fill: #2d3436; }
  .note { font-size: 11px; fill: #636e72; }
  .arrow { stroke: #6c5ce7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: #dfe6e9; stroke: #636e72; stroke-width: 1.5; }
  .highlight { fill: #ffeaa7; stroke: #fdcb6e; stroke-width: 1.5; }
  .action { fill: #81ecec; stroke: #00b894; stroke-width: 1.5; }
  .important { fill: #fab1a0; stroke: #e17055; stroke-width: 1.5; }
  .step { fill: #a29bfe; stroke: #6c5ce7; stroke-width: 1.5; }
  .note-box { fill: #f8f9fa; stroke: #b2bec3; stroke-width: 1; }
  .cache { fill: #fdcb6e; stroke: #f39c12; stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#6c5ce7"/>
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#e17055"/>
  </marker>
</defs>
<text x="400" y="28" class="title">可观测性排障流程：Trace 追踪示例</text>
<rect x="50" y="50" width="700" height="40" class="box phase"/>
<text x="400.0" y="70.0" class="label">① Grafana 发现 order-service 的 P99 从 200ms 升到 2s（14:00 开始）</text>
<line x1="400" y1="90" x2="400" y2="110" class="arrow"/><rect x="50" y="110" width="700" height="40" class="box step"/>
<text x="400.0" y="130.0" class="label">② 登录 Jaeger，选择 order-service，时间范围 14:00-14:10，找到 2.1s 的 Trace</text>
<line x1="400" y1="150" x2="400" y2="170" class="arrow"/><text x="80" y="185" text-anchor="start" class="label" font-weight="bold">③ 查看 Trace 的 Span 树：</text>
<rect x="50" y="200" width="700" height="24" rx="4" class="box important"/>
<text x="58" y="212" text-anchor="start" class="note">order-service [GET /api/order/10086]</text>
<text x="742" y="212" text-anchor="end" class="note" font-weight="bold">2100ms</text>
<rect x="80" y="240" width="300" height="24" rx="4" class="box phase"/>
<text x="88" y="252" text-anchor="start" class="note">Controller.getOrder</text>
<text x="372" y="252" text-anchor="end" class="note" font-weight="bold">5ms</text>
<rect x="80" y="270" width="300" height="24" rx="4" class="box phase"/>
<text x="88" y="282" text-anchor="start" class="note">MyBatis: selectOrder</text>
<text x="372" y="282" text-anchor="end" class="note" font-weight="bold">15ms</text>
<rect x="80" y="300" width="300" height="24" rx="4" class="box important"/>
<text x="88" y="312" text-anchor="start" class="note">Feign: payment-service</text>
<text x="372" y="312" text-anchor="end" class="note" font-weight="bold">1800ms</text>
<rect x="110" y="330" width="280" height="24" rx="4" class="box highlight"/>
<text x="118" y="342" text-anchor="start" class="note">POST /api/payment/query</text>
<text x="382" y="342" text-anchor="end" class="note" font-weight="bold">1780ms</text>
<rect x="140" y="360" width="250" height="24" rx="4" class="box phase"/>
<text x="148" y="372" text-anchor="start" class="note">MyBatis: selectPayment</text>
<text x="382" y="372" text-anchor="end" class="note" font-weight="bold">20ms</text>
<rect x="140" y="390" width="250" height="24" rx="4" class="box important"/>
<text x="148" y="402" text-anchor="start" class="note">Feign: account-service</text>
<text x="382" y="402" text-anchor="end" class="note" font-weight="bold">1750ms</text>
<rect x="170" y="420" width="230" height="24" rx="4" class="box highlight"/>
<text x="178" y="432" text-anchor="start" class="note">POST /api/account/balance</text>
<text x="392" y="432" text-anchor="end" class="note" font-weight="bold">1740ms</text>
<rect x="200" y="450" width="200" height="24" rx="4" class="box important"/>
<text x="208" y="462" text-anchor="start" class="note">Redis: get</text>
<text x="392" y="462" text-anchor="end" class="note" font-weight="bold">1730ms ← 根因!</text>
<rect x="80" y="480" width="300" height="24" rx="4" class="box phase"/>
<text x="88" y="492" text-anchor="start" class="note">MyBatis: selectItems</text>
<text x="372" y="492" text-anchor="end" class="note" font-weight="bold">10ms</text>
<rect x="50" y="500" width="700" height="40" class="box step"/>
<text x="400.0" y="520.0" class="label">④ 用 TraceID 到 Kibana 搜索日志</text>
<text x="80" y="560" text-anchor="start" class="note">account-service 日志：Redis connection timeout after 1730ms, host: redis-cluster:6379</text>
<line x1="400" y1="540" x2="400" y2="580" class="arrow"/><rect x="50" y="580" width="700" height="60" class="box important"/>
<text x="400.0" y="602.0" class="label">⑤ 根因：Redis 集群某个节点网络抖动，导致连接超时</text>
<text x="400.0" y="618.0" class="label">修复：Redis 集群增加节点 + 应用层增加 Redis 读超时兜底</text>

</svg>