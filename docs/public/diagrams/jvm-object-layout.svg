<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">HotSpot 对象内存布局（64 位 JVM）</text>

  <!-- 对象头 -->
  <rect x="100" y="52" width="320" height="120" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2"/>
  <text x="260" y="76" text-anchor="middle" fill="var(--diagram-accent-1)" font-weight="bold" font-size="11">对象头（Object Header）</text>

  <!-- Mark Word -->
  <rect x="120" y="88" width="136" height="72" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="188" y="108" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="10">Mark Word</text>
  <text x="188" y="124" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">8 字节（64 bit）</text>
  <text x="188" y="140" text-anchor="middle" fill="var(--diagram-arrow)" font-size="8">hashCode / GC 年龄</text>
  <text x="188" y="152" text-anchor="middle" fill="var(--diagram-arrow)" font-size="8">锁状态标志</text>

  <!-- Klass Pointer -->
  <rect x="264" y="88" width="136" height="72" rx="4" fill="var(--diagram-accent-bg-1b)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="332" y="108" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold" font-size="10">Klass Pointer</text>
  <text x="332" y="124" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">4 或 8 字节</text>
  <text x="332" y="140" text-anchor="middle" fill="var(--diagram-arrow)" font-size="8">指向方法区中</text>
  <text x="332" y="152" text-anchor="middle" fill="var(--diagram-arrow)" font-size="8">该类的元数据</text>

  <!-- 实例数据 -->
  <rect x="100" y="184" width="320" height="120" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="2"/>
  <text x="260" y="210" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold" font-size="11">实例数据（Instance Data）</text>

  <!-- 父类字段 -->
  <rect x="120" y="222" width="136" height="36" rx="4" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="188" y="245" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="9">父类字段在前</text>

  <!-- 子类字段 -->
  <rect x="264" y="222" width="136" height="36" rx="4" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="332" y="245" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="9">子类字段在后</text>

  <!-- 字段示例 -->
  <rect x="120" y="266" width="280" height="28" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="260" y="285" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">int id / String name / boolean active ...</text>

  <!-- 对齐填充 -->
  <rect x="100" y="316" width="320" height="52" rx="8" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="2"/>
  <text x="260" y="340" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold" font-size="11">对齐填充（Padding）</text>
  <text x="260" y="358" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">保证对象总大小是 8 字节的整数倍</text>

  <!-- 尺寸标注 - 左侧 -->
  <line x1="80" y1="52" x2="80" y2="172" stroke="var(--diagram-accent-1)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="76" y1="52" x2="84" y2="52" stroke="var(--diagram-accent-1)" stroke-width="1"/>
  <line x1="76" y1="172" x2="84" y2="172" stroke="var(--diagram-accent-1)" stroke-width="1"/>
  <text x="70" y="116" text-anchor="middle" fill="var(--diagram-accent-1)" font-size="8" transform="rotate(-90,70,116)">12~16 字节</text>

  <line x1="80" y1="184" x2="80" y2="304" stroke="var(--diagram-accent-2)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="76" y1="184" x2="84" y2="184" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <line x1="76" y1="304" x2="84" y2="304" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="70" y="248" text-anchor="middle" fill="var(--diagram-accent-2)" font-size="8" transform="rotate(-90,70,248)">大小不固定</text>

  <!-- 底部注释 -->
  <rect x="80" y="392" width="360" height="100" rx="4" fill="none" stroke="var(--diagram-accent-3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="414" text-anchor="middle" fill="var(--diagram-accent-3)" font-size="10" font-weight="bold">压缩指针（-XX:+UseCompressedOops）</text>
  <text x="260" y="432" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">64 位 JVM 默认开启 → Klass Pointer 占 4 字节</text>
  <text x="260" y="450" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">关闭时 → Klass Pointer 占 8 字节</text>
  <text x="260" y="470" text-anchor="middle" fill="var(--diagram-accent-3)" font-size="10" font-weight="bold">Mark Word 与锁状态</text>
  <text x="260" y="486" text-anchor="middle" fill="var(--diagram-arrow)" font-size="9">加锁后 Mark Word 内容被覆盖，存储锁信息而非 hashCode</text>

  <!-- 底部总结 -->
  <text x="260" y="512" text-anchor="middle" fill="var(--diagram-text-3)" font-size="9">对象头 | 实例数据 | 对齐填充 → 8 字节对齐</text>
</svg>
