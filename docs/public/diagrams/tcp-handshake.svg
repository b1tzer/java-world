<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-right" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-1)"/>
    </marker>
    <marker id="arr-left" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="var(--diagram-accent-2)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-text-1)">TCP 三次握手</text>

  <!-- Client column -->
  <rect x="80" y="50" width="140" height="40" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-1)">客户端 (Client)</text>
  <line x1="150" y1="90" x2="150" y2="380" stroke="var(--diagram-accent-1)" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Server column -->
  <rect x="480" y="50" width="140" height="40" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="2"/>
  <text x="550" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">服务端 (Server)</text>
  <line x1="550" y1="90" x2="550" y2="380" stroke="var(--diagram-accent-2)" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Step 1: SYN -->
  <line x1="170" y1="140" x2="530" y2="140" stroke="var(--diagram-accent-1)" stroke-width="2.5" marker-end="url(#arr-right)"/>
  <text x="350" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-1)">① SYN, seq=x</text>
  <rect x="260" y="148" width="180" height="28" rx="4" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-bg-1b)" stroke-width="1"/>
  <text x="350" y="167" text-anchor="middle" font-size="9" fill="var(--diagram-accent-1)">我想连接你，初始序列号 x</text>

  <!-- Step 2: SYN+ACK -->
  <line x1="530" y1="220" x2="170" y2="220" stroke="var(--diagram-accent-2)" stroke-width="2.5" marker-end="url(#arr-left)"/>
  <text x="350" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">② SYN+ACK, seq=y, ack=x+1</text>
  <rect x="240" y="228" width="220" height="28" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-bg-2b)" stroke-width="1"/>
  <text x="350" y="247" text-anchor="middle" font-size="9" fill="var(--diagram-accent-2)">同意连接，初始序列号 y，确认 x+1</text>

  <!-- Step 3: ACK -->
  <line x1="170" y1="310" x2="530" y2="310" stroke="var(--diagram-accent-1)" stroke-width="2.5" marker-end="url(#arr-right)"/>
  <text x="350" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-1)">③ ACK, ack=y+1</text>
  <rect x="270" y="318" width="160" height="28" rx="4" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-bg-1b)" stroke-width="1"/>
  <text x="350" y="337" text-anchor="middle" font-size="9" fill="var(--diagram-accent-1)">确认你的序列号 y+1</text>

  <!-- ESTABLISHED labels -->
  <rect x="60" y="360" width="180" height="30" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="150" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">ESTABLISHED</text>

  <rect x="460" y="360" width="180" height="30" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="550" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-accent-text-2)">ESTABLISHED</text>
</svg>