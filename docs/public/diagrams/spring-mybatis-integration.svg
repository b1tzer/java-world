<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
<style>
  text { text-anchor: middle; dominant-baseline: central; }
  .title { font-size: 15px; font-weight: bold; fill: var(--diagram-text-1); }
  .label { font-size: 12px; fill: var(--diagram-text-1); }
  .note { font-size: 11px; fill: var(--diagram-text-2); }
  .arrow { stroke: var(--diagram-accent-3); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  .box { rx: 8; ry: 8; }
  .phase { fill: var(--diagram-surface-3); stroke: var(--diagram-text-2); stroke-width: 1.5; }
  .step { fill: var(--diagram-accent-bg-3b); stroke: var(--diagram-accent-3); stroke-width: 1.5; }
  .action { fill: var(--diagram-accent-bg-2); stroke: var(--diagram-accent-2); stroke-width: 1.5; }
  .highlight { fill: var(--diagram-accent-bg-4); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
  .important { fill: var(--diagram-accent-bg-5); stroke: var(--diagram-accent-4); stroke-width: 1.5; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--diagram-accent-3)"/>
  </marker>
</defs>

<text x="400" y="28" class="title">Spring 容器启动 → MyBatis Mapper 注册</text>

<!-- Root: Spring 容器启动 -->
<rect x="220" y="48" width="360" height="36" class="box important"/>
<text x="400" y="66" class="label" font-weight="bold">Spring 容器启动</text>

<!-- Three branches -->
<line x1="400" y1="84" x2="160" y2="110" class="arrow"/>
<line x1="400" y1="84" x2="400" y2="110" class="arrow"/>
<line x1="400" y1="84" x2="640" y2="110" class="arrow"/>

<!-- Branch 1: @MapperScan -->
<rect x="30" y="110" width="260" height="32" class="box step"/>
<text x="160" y="126" class="label" font-weight="bold">1. 处理 @MapperScan</text>

<line x1="160" y1="142" x2="160" y2="160" class="arrow"/>
<rect x="30" y="160" width="260" height="28" class="box action"/>
<text x="160" y="174" class="note">MapperScannerRegistrar</text>

<line x1="160" y1="188" x2="160" y2="206" class="arrow"/>
<rect x="30" y="206" width="260" height="28" class="box action"/>
<text x="160" y="220" class="note">ClassPathMapperScanner.doScan()</text>

<line x1="160" y1="234" x2="160" y2="252" class="arrow"/>
<rect x="30" y="252" width="260" height="72" class="box phase"/>
<text x="160" y="268" class="label">找到 Mapper 接口：</text>
<text x="160" y="288" class="note">UserMapper</text>
<text x="160" y="306" class="note">OrderMapper</text>
<text x="160" y="320" class="note">ProductMapper</text>

<!-- Branch 2: 注册 BeanDefinition -->
<rect x="290" y="110" width="220" height="32" class="box highlight"/>
<text x="400" y="126" class="label" font-weight="bold">2. 注册 BeanDefinition</text>

<line x1="400" y1="142" x2="400" y2="160" class="arrow"/>
<rect x="290" y="160" width="220" height="80" class="box phase"/>
<text x="400" y="178" class="note">UserMapper → MapperFactoryBean</text>
<text x="400" y="198" class="note">OrderMapper → MapperFactoryBean</text>
<text x="400" y="218" class="note">ProductMapper → MapperFactoryBean</text>

<!-- Branch 3: 创建 Bean -->
<rect x="530" y="110" width="240" height="32" class="box important"/>
<text x="650" y="126" class="label" font-weight="bold">3. 创建 Bean</text>

<line x1="650" y1="142" x2="650" y2="160" class="arrow"/>
<rect x="530" y="160" width="240" height="52" class="box action"/>
<text x="650" y="178" class="note">MapperFactoryBean</text>
<text x="650" y="196" class="note">.getObject()</text>

<line x1="650" y1="212" x2="650" y2="232" class="arrow"/>
<rect x="530" y="232" width="240" height="40" class="box action"/>
<text x="650" y="246" class="note">SqlSession.getMapper()</text>
<text x="650" y="262" class="note">(UserMapper.class)</text>

<!-- Converge to result -->
<line x1="160" y1="324" x2="400" y2="370" class="arrow"/>
<line x1="400" y1="240" x2="400" y2="370" class="arrow"/>
<line x1="650" y1="272" x2="400" y2="370" class="arrow"/>

<rect x="180" y="370" width="440" height="44" class="box important"/>
<text x="400" y="386" class="label" font-weight="bold">返回 MapperProxy 代理对象</text>
<text x="400" y="402" class="note">→ 注册到 Spring 容器</text>

</svg>