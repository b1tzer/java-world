<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text-1)">BIO 线程生命周期（单个连接）</text>

  <!-- Timeline bar -->
  <rect x="40" y="50" width="260" height="36" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="170" y="74" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">read 阻塞等待 200ms</text>

  <rect x="300" y="50" width="40" height="36" rx="4" fill="var(--diagram-accent-bg-2b)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="320" y="74" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="11">处理</text>
  <text x="320" y="88" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="10">5ms</text>

  <rect x="340" y="50" width="240" height="36" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1.5"/>
  <text x="460" y="74" text-anchor="middle" fill="var(--diagram-accent-text-5)" font-weight="bold">read 阻塞等待 500ms</text>

  <!-- Bracket: wasted time -->
  <line x1="40" y1="105" x2="300" y2="105" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <line x1="40" y1="100" x2="40" y2="110" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <line x1="300" y1="100" x2="300" y2="110" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <text x="170" y="122" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="12">线程被白白占用</text>

  <line x1="340" y1="105" x2="580" y2="105" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <line x1="340" y1="100" x2="340" y2="110" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <line x1="580" y1="100" x2="580" y2="110" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <text x="460" y="122" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="12">又白等</text>

  <!-- Stats -->
  <text x="310" y="148" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">计算 5ms / 总耗时 705ms ≈ 0.7% — 99%+ 的时间在"等"</text>
</svg>