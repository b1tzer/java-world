<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--diagram-text-1)">TCP 滑动窗口示意图</text>
  <text x="360" y="50" text-anchor="middle" font-size="13" fill="var(--diagram-text-2)">发送窗口大小 = 4000 字节</text>

  <!-- Window before slide -->
  <text x="360" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-arrow)">当前窗口状态</text>

  <!-- Full bar -->
  <rect x="60" y="95" width="600" height="50" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1.5"/>

  <!-- 已确认 (green) -->
  <rect x="60" y="95" width="150" height="50" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="135" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-2)">已确认</text>
  <text x="135" y="133" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-2)">已收到 ACK</text>

  <!-- 可发送(未确认) (blue) -->
  <rect x="210" y="95" width="250" height="50" rx="0" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="335" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-1)">可发送 (未确认)</text>
  <text x="335" y="133" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)">已发送等待 ACK</text>

  <!-- 不可发送 (gray) -->
  <rect x="460" y="95" width="200" height="50" rx="0" fill="var(--diagram-surface-3)" stroke="var(--diagram-ghost)" stroke-width="1.5"/>
  <text x="560" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-arrow)">不可发送</text>
  <text x="560" y="133" text-anchor="middle" font-size="11" fill="var(--diagram-ghost)">窗口之外</text>

  <!-- Window size bracket -->
  <line x1="210" y1="160" x2="460" y2="160" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <line x1="210" y1="155" x2="210" y2="165" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <line x1="460" y1="155" x2="460" y2="165" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="335" y="178" text-anchor="middle" font-size="12" fill="var(--diagram-accent-4)" font-weight="bold">◀───── 窗口大小 ─────▶</text>

  <!-- Arrow down -->
  <text x="360" y="210" text-anchor="middle" font-size="13" fill="var(--diagram-accent-text-3)">每收到一个 ACK，窗口向右滑动 →</text>

  <!-- Window after slide -->
  <text x="360" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-arrow)">滑动后</text>

  <rect x="60" y="250" width="600" height="50" rx="4" fill="var(--diagram-surface-2)" stroke="var(--diagram-stroke-1)" stroke-width="1.5"/>

  <!-- 已确认 (larger green) -->
  <rect x="60" y="250" width="250" height="50" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="185" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-2)">已确认</text>
  <text x="185" y="288" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-2)">更多数据已确认</text>

  <!-- 可发送 (blue) -->
  <rect x="310" y="250" width="250" height="50" rx="0" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="435" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-accent-text-1)">可发送 (未确认)</text>
  <text x="435" y="288" text-anchor="middle" font-size="11" fill="var(--diagram-accent-text-1)">窗口右移</text>

  <!-- 不可发送 (smaller gray) -->
  <rect x="560" y="250" width="100" height="50" rx="0" fill="var(--diagram-surface-3)" stroke="var(--diagram-ghost)" stroke-width="1.5"/>
  <text x="610" y="280" text-anchor="middle" font-size="11" fill="var(--diagram-ghost)">不可发送</text>
</svg>