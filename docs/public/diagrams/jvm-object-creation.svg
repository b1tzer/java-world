<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 780" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-text-3)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text-1)">对象创建流程（new User("Tom")）</text>

  <!-- Step 1: 类加载检查 -->
  <rect x="170" y="50" width="280" height="48" rx="6" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="210" y="71" fill="var(--diagram-accent-1)" font-weight="bold">1. 类加载检查</text>
  <text x="310" y="89" text-anchor="middle" fill="var(--diagram-arrow)" font-size="12">User 类是否已加载？没有 → 先执行类加载</text>
  <line x1="310" y1="98" x2="310" y2="122" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2: 分配内存 -->
  <rect x="120" y="126" width="380" height="200" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="310" y="150" text-anchor="middle" fill="var(--diagram-accent-text-4)" font-weight="bold" font-size="14">2. 分配内存</text>

  <!-- 内存是否规整 -->
  <rect x="145" y="162" width="160" height="42" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <text x="225" y="180" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="12" font-weight="bold">堆内存是否规整？</text>
  <text x="225" y="196" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">由 GC 算法决定</text>

  <!-- 是 → 指针碰撞 -->
  <line x1="145" y1="183" x2="105" y2="183" stroke="var(--diagram-text-3)" stroke-width="1" marker-end="url(#arrowRight)"/>
  <rect x="20" y="164" width="82" height="38" rx="4" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="61" y="181" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="11" font-weight="bold">是</text>
  <text x="61" y="195" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">指针碰撞</text>

  <!-- 否 → 空闲列表 -->
  <line x1="305" y1="183" x2="345" y2="183" stroke="var(--diagram-text-3)" stroke-width="1" marker-end="url(#arrowRight)"/>
  <rect x="348" y="164" width="82" height="38" rx="4" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <text x="389" y="181" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="11" font-weight="bold">否</text>
  <text x="389" y="195" text-anchor="middle" fill="var(--diagram-arrow)" font-size="10">空闲列表</text>

  <!-- 线程安全 -->
  <rect x="145" y="218" width="310" height="96" rx="4" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1"/>
  <text x="300" y="237" text-anchor="middle" fill="var(--diagram-accent-4)" font-size="12" font-weight="bold">线程安全？</text>

  <!-- TLAB -->
  <rect x="160" y="246" width="280" height="30" rx="3" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1"/>
  <text x="300" y="266" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-size="11">TLAB：每个线程在 Eden 有私有缓冲区，无需 CAS</text>

  <!-- TLAB 用完 -->
  <rect x="160" y="282" width="280" height="26" rx="3" fill="var(--diagram-accent-bg-5)" stroke="var(--diagram-accent-5)" stroke-width="1"/>
  <text x="300" y="300" text-anchor="middle" fill="var(--diagram-accent-5)" font-size="11">TLAB 用完 → Eden 共享区分配，需要 CAS 同步</text>

  <line x1="310" y1="326" x2="310" y2="350" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3: 初始化零值 -->
  <rect x="170" y="354" width="280" height="56" rx="6" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="310" y="376" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">3. 初始化零值</text>
  <text x="310" y="394" text-anchor="middle" fill="var(--diagram-arrow)" font-size="12">int=0, boolean=false, 引用=null</text>
  <text x="310" y="406" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">JVM 保证零值初始化，字段使用前必有确定值</text>
  <line x1="310" y1="410" x2="310" y2="434" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 4: 设置对象头 -->
  <rect x="170" y="438" width="280" height="56" rx="6" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="1.5"/>
  <text x="310" y="460" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">4. 设置对象头</text>
  <text x="310" y="478" text-anchor="middle" fill="var(--diagram-arrow)" font-size="12">Mark Word（hashCode、GC 年龄、锁状态）</text>
  <text x="310" y="490" text-anchor="middle" fill="var(--diagram-arrow)" font-size="12">Klass Pointer（指向方法区中的类元数据）</text>
  <line x1="310" y1="494" x2="310" y2="518" stroke="var(--diagram-arrow)" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 5: 执行 <init> -->
  <rect x="170" y="522" width="280" height="48" rx="6" fill="var(--diagram-accent-bg-4)" stroke="var(--diagram-accent-4)" stroke-width="1.5"/>
  <text x="310" y="544" text-anchor="middle" fill="var(--diagram-accent-4)" font-weight="bold">5. 执行 &lt;init&gt; 构造方法</text>
  <text x="310" y="562" text-anchor="middle" fill="var(--diagram-arrow)" font-size="12">你写的构造方法代码</text>

  <!-- 底部注释 -->
  <rect x="130" y="594" width="360" height="64" rx="4" fill="none" stroke="var(--diagram-accent-3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="310" y="614" text-anchor="middle" fill="var(--diagram-accent-3)" font-size="12" font-weight="bold">TLAB 是关键优化</text>
  <text x="310" y="632" text-anchor="middle" fill="var(--diagram-arrow)" font-size="11">没有 TLAB，多线程同时在 Eden 分配对象需要加锁（CAS）</text>
  <text x="310" y="648" text-anchor="middle" fill="var(--diagram-arrow)" font-size="11">TLAB 让每个线程有自己的"私人领地"，分配只需移动指针</text>

  <!-- 流程箭头装饰 -->
  <line x1="310" y1="570" x2="310" y2="592" stroke="var(--diagram-accent-3)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 底部说明 -->
  <text x="310" y="690" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">-XX:+UseTLAB 默认开启，大部分对象分配无需真正同步</text>
  <text x="310" y="710" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">超过 -XX:PretenureSizeThreshold 的大对象直接分配在老年代</text>

  <!-- 顶部标注行号 -->
  <text x="20" y="770" fill="var(--diagram-ghost)" font-size="10">共 5 步：类加载 → 分配内存 → 零值初始化 → 设置对象头 → 执行构造方法</text>
</svg>
