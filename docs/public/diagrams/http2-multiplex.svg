<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">HTTP/2 多路复用 vs HTTP/1.1 串行</text>

  <!-- Left: HTTP/1.1 串行 -->
  <text x="190" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">HTTP/1.1（串行 / 队头阻塞）</text>
  <g transform="translate(30, 70)">
    <!-- Timeline -->
    <line x1="0" y1="0" x2="320" y2="0" stroke="#BDBDBD" stroke-width="1"/>
    <text x="-10" y="4" font-size="10" fill="#999">t</text>

    <!-- Request 1 -->
    <rect x="0" y="14" width="100" height="30" rx="4" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
    <text x="50" y="33" text-anchor="middle" font-size="11" fill="#B71C1C" font-weight="bold">请求 1</text>
    <rect x="100" y="14" width="80" height="30" rx="4" fill="#EF9A9A" stroke="#C62828" stroke-width="1"/>
    <text x="140" y="33" text-anchor="middle" font-size="11" fill="#B71C1C">响应 1</text>

    <!-- Request 2 -->
    <rect x="180" y="14" width="60" height="30" rx="4" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
    <text x="210" y="33" text-anchor="middle" font-size="11" fill="#B71C1C" font-weight="bold">请求 2</text>
    <rect x="240" y="14" width="50" height="30" rx="4" fill="#EF9A9A" stroke="#C62828" stroke-width="1"/>
    <text x="265" y="33" text-anchor="middle" font-size="11" fill="#B71C1C">响应 2</text>

    <!-- Waiting indicator -->
    <rect x="100" y="52" width="80" height="22" rx="3" fill="#FFEBEE" stroke="#C62828" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="140" y="67" text-anchor="middle" font-size="10" fill="#C62828">⏳ 等待响应 1</text>

    <!-- Problems -->
    <text x="0" y="100" font-size="11" fill="#C62828">❌ 请求必须排队等前一个响应</text>
    <text x="0" y="118" font-size="11" fill="#C62828">❌ 响应严格按请求顺序返回</text>
    <text x="0" y="136" font-size="11" fill="#C62828">❌ 一个慢请求阻塞所有后续</text>
  </g>

  <!-- Right: HTTP/2 多路复用 -->
  <text x="570" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">HTTP/2（多路复用）</text>
  <g transform="translate(410, 70)">
    <!-- Single TCP connection -->
    <rect x="0" y="0" width="340" height="160" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="170" y="20" text-anchor="middle" font-size="12" fill="#0D47A1" font-weight="bold">单个 TCP 连接</text>

    <!-- Stream 1 -->
    <rect x="16" y="30" width="60" height="24" rx="3" fill="#BBDEFB" stroke="#1565C0" stroke-width="1"/>
    <text x="46" y="46" text-anchor="middle" font-size="10" fill="#0D47A1">S1 请求</text>
    <rect x="76" y="30" width="40" height="24" rx="3" fill="#90CAF9" stroke="#1565C0" stroke-width="1"/>
    <text x="96" y="46" text-anchor="middle" font-size="10" fill="#0D47A1">帧</text>
    <rect x="116" y="30" width="40" height="24" rx="3" fill="#90CAF9" stroke="#1565C0" stroke-width="1"/>
    <text x="136" y="46" text-anchor="middle" font-size="10" fill="#0D47A1">帧</text>

    <!-- Stream 2 -->
    <rect x="16" y="60" width="40" height="24" rx="3" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/>
    <text x="36" y="76" text-anchor="middle" font-size="10" fill="#1B5E20">S2</text>
    <rect x="56" y="60" width="50" height="24" rx="3" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1"/>
    <text x="81" y="76" text-anchor="middle" font-size="10" fill="#1B5E20">请求</text>
    <rect x="106" y="60" width="30" height="24" rx="3" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1"/>
    <text x="121" y="76" text-anchor="middle" font-size="10" fill="#1B5E20">帧</text>

    <!-- Stream 3 -->
    <rect x="16" y="90" width="30" height="24" rx="3" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
    <text x="31" y="106" text-anchor="middle" font-size="10" fill="#BF360C">S3</text>
    <rect x="46" y="90" width="40" height="24" rx="3" fill="#FFCC80" stroke="#E65100" stroke-width="1"/>
    <text x="66" y="106" text-anchor="middle" font-size="10" fill="#BF360C">请求</text>
    <rect x="86" y="90" width="60" height="24" rx="3" fill="#FFCC80" stroke="#E65100" stroke-width="1"/>
    <text x="116" y="106" text-anchor="middle" font-size="10" fill="#BF360C">响应帧</text>

    <!-- Interleaving note -->
    <text x="170" y="140" text-anchor="middle" font-size="10" fill="#1565C0">帧可以交错传输，按 Stream ID 重组</text>
    <text x="170" y="154" text-anchor="middle" font-size="10" fill="#1565C0">Stream 1 的大文件不会阻塞 Stream 3 的小文件</text>
  </g>

  <!-- Benefits -->
  <g transform="translate(410, 240)">
    <text x="0" y="0" font-size="11" fill="#1565C0">✅ 多个请求/响应并行交错</text>
    <text x="0" y="18" font-size="11" fill="#1565C0">✅ 无应用层队头阻塞</text>
    <text x="0" y="36" font-size="11" fill="#1565C0">✅ 单 TCP 连接，减少握手开销</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 290)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#BBDEFB" stroke="#1565C0" stroke-width="1"/>
    <text x="18" y="11" font-size="10" fill="#333">Stream 1 (GET /index.html)</text>
    <rect x="180" y="0" width="12" height="12" rx="2" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/>
    <text x="198" y="11" font-size="10" fill="#333">Stream 2 (GET /style.css)</text>
    <rect x="360" y="0" width="12" height="12" rx="2" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
    <text x="378" y="11" font-size="10" fill="#333">Stream 3 (GET /app.js)</text>
  </g>
</svg>
