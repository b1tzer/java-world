<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text-1)">Selector 多路复用器</text>
  <!-- Selector thread -->
  <rect x="160" y="50" width="200" height="60" rx="8" fill="var(--diagram-accent-bg-3)" stroke="var(--diagram-accent-3)" stroke-width="2"/>
  <text x="260" y="76" text-anchor="middle" fill="var(--diagram-accent-text-3)" font-weight="bold">Selector 线程</text>
  <text x="260" y="96" text-anchor="middle" fill="var(--diagram-text-2)" font-size="12">select() 阻塞等待事件</text>
  <!-- Channels -->
  <rect x="40" y="200" width="120" height="70" rx="8" fill="var(--diagram-accent-bg-1)" stroke="var(--diagram-accent-1)" stroke-width="1.5"/>
  <text x="100" y="228" text-anchor="middle" fill="var(--diagram-accent-text-1)" font-weight="bold">Channel 1</text>
  <text x="100" y="248" text-anchor="middle" fill="var(--diagram-text-2)" font-size="12">可读事件 ✓</text>
  <text x="100" y="263" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">客户端连接</text>
  <rect x="200" y="200" width="120" height="70" rx="8" fill="var(--diagram-accent-bg-2)" stroke="var(--diagram-accent-2)" stroke-width="1.5"/>
  <text x="260" y="228" text-anchor="middle" fill="var(--diagram-accent-text-2)" font-weight="bold">Channel 2</text>
  <text x="260" y="248" text-anchor="middle" fill="var(--diagram-text-2)" font-size="12">可写事件 ✓</text>
  <text x="260" y="263" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">客户端连接</text>
  <rect x="360" y="200" width="120" height="70" rx="8" fill="var(--diagram-surface-3)" stroke="var(--diagram-stroke-1)" stroke-width="1.5"/>
  <text x="420" y="228" text-anchor="middle" fill="var(--diagram-text-1)" font-weight="bold">Channel N</text>
  <text x="420" y="248" text-anchor="middle" fill="var(--diagram-ghost)" font-size="12">无事件</text>
  <text x="420" y="263" text-anchor="middle" fill="var(--diagram-text-3)" font-size="11">客户端连接</text>
  <!-- Arrows -->
  <line x1="200" y1="110" x2="100" y2="198" stroke="var(--diagram-accent-1)" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="260" y1="110" x2="260" y2="198" stroke="var(--diagram-accent-2)" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="320" y1="110" x2="420" y2="198" stroke="var(--diagram-stroke-1)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <!-- Event labels -->
  <text x="130" y="160" fill="#1565C0" font-size="11">OP_READ</text>
  <text x="268" y="160" fill="#2E7D32" font-size="11">OP_WRITE</text>
  <!-- Footer -->
  <text x="260" y="310" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">一个线程通过 select() 同时监听多个 Channel 的 I/O 事件</text>
  <text x="260" y="330" text-anchor="middle" fill="var(--diagram-text-3)" font-size="12">只有就绪的 Channel 才会被处理，无需为每个连接阻塞一个线程</text>
  <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-arrow)"/></marker></defs>
</svg>